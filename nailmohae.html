// 업종별 홈 카테고리. 상품(디자인)의 cat 값이 중간 항목(둘러보기 카테고리)과 일치해야 함.
const COMMON_CATEGORY_HEAD = { key: '전체', label: '추천', emoji: '✨' };
const COMMON_CATEGORY_TAIL = [{ key: '인기랭킹', label: '랭킹샵', emoji: '🏆' }, { key: '이벤트', label: '이벤트', emoji: '🎁' }];
const BROWSE_CATEGORIES = {
  nail: [{ key: '네일아트', label: '네일아트', emoji: '💅' }, { key: '페디큐어', label: '페디큐어', emoji: '🦶' }],

  lash: [{ key: '속눈썹펌', label: '속눈썹펌', emoji: '👁️' }]
};
const categoriesFor = (biz) => [COMMON_CATEGORY_HEAD, ...(BROWSE_CATEGORIES[biz] || []), ...COMMON_CATEGORY_TAIL];
// 카테고리 키 → 화면 표시 이름 (예: 탈모케어 → 볼륨케어)
const catLabel = (key) => { for (const list of Object.values(BROWSE_CATEGORIES)) { const c = list.find(x => x.key === key); if (c) return c.label; } return key; };
const isBrowseCategory = (cat) => !['전체', '인기랭킹', '이벤트'].includes(cat);

// 원장님이 지도에서 핀을 드래그해 위치를 보정할 수 있게 함.
// 상용화 시 카카오맵 JS SDK(services 라이브러리) 또는 백엔드 지오코딩으로 교체 권장.
const LEAFLET_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
let leafletPromise = null;

function loadLeaflet() {
  if (typeof window === 'undefined' || typeof document === 'undefined') return Promise.reject(new Error('no-dom'));
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (leafletPromise) return leafletPromise;
  leafletPromise = new Promise((resolve, reject) => {
    if (!document.getElementById('leaflet-css')) {
      const link = document.createElement('link');
      link.id = 'leaflet-css';
      link.rel = 'stylesheet';
      link.href = LEAFLET_BASE + 'leaflet.css';
      document.head.appendChild(link);
    }
    const script = document.createElement('script');
    script.src = LEAFLET_BASE + 'leaflet.js';
    script.async = true;
    const timer = setTimeout(() => fail(new Error('leaflet-timeout')), 10000);
    function fail(err) { clearTimeout(timer); leafletPromise = null; reject(err); }
    script.onload = () => {
      clearTimeout(timer);
      if (window.L && window.L.map) resolve(window.L); else fail(new Error('leaflet-missing'));
    };
    script.onerror = () => fail(new Error('leaflet-load-failed'));
    document.head.appendChild(script);
  });
  return leafletPromise;
}

// "(조례호수공원 5분)" 같은 안내 문구 제거
function normalizeAddress(address) {
  return (address || '').replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
}

// 지오코딩용: 맨 앞 시·도(전남/전라남도/광역시 등)는 뺀다.
// OSM은 행정구역 개편으로 시·도 명칭이 바뀌어(예: 전남광주통합특별시) "전라남도 …"로 검색하면 결과가 비는 문제가 있음.
// 시/군/구부터 검색해도 같은 이름의 동이 다른 시에 있는 경우는 시 이름으로 충분히 구분됨.
function geocodeQuery(address) {
  const tokens = normalizeAddress(address).split(' ').filter(Boolean);
  if (tokens.length > 2 && /^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)$|(도|특별시|광역시|특별자치시)$/.test(tokens[0])) {
    tokens.shift();
  }
  return tokens.join(' ');
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// 반환: { lat, lng, precise } | null  (precise=false면 동/읍 단위 등으로 범위를 넓혀 찾은 결과)
async function geocodeAddress(address) {
  const full = geocodeQuery(address);
  if (!full) return null;
  const tokens = full.split(' ');
  const candidates = [full];
  // 번지/건물번호로 못 찾으면 뒤에서부터 한 단어씩 빼서 재시도 (최대 3회, Nominatim 1초 제한 준수)
  for (let n = tokens.length - 1; n >= 2 && candidates.length < 3; n--) candidates.push(tokens.slice(0, n).join(' '));
  for (let i = 0; i < candidates.length; i++) {
    if (i > 0) await sleep(1100);
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q=' + encodeURIComponent(candidates[i]);
    const res = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('geocode-http-' + res.status);
    const data = await res.json();
    if (data && data.length) {
      return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), precise: i === 0 };
    }
  }
  return null;
}

// 실제 지도. Leaflet 로드 실패(오프라인·CDN 차단) 시 SVG 약도로 자동 대체.
function ShopMap({ lat, lng, label, height = 150, draggable = false, onMove }) {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const onMoveRef = useRef(onMove);
  onMoveRef.current = onMove;
  const [failed, setFailed] = useState(false);
  const hasCoords = Number.isFinite(lat) && Number.isFinite(lng);

  useEffect(() => {
    if (!hasCoords) return undefined;
    let cancelled = false;
    loadLeaflet().then((L) => {
      if (cancelled || !elRef.current) return;
      if (!mapRef.current) {
        const map = L.map(elRef.current, {
          zoomControl: draggable, scrollWheelZoom: false, attributionControl: true
        }).setView([lat, lng], 16);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>'
        }).addTo(map);
        const icon = L.divIcon({
          className: '',
          html: '<div style="font-size:28px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))">📍</div>',
          iconSize: [28, 28], iconAnchor: [14, 28]
        });
        const marker = L.marker([lat, lng], { icon, draggable, keyboard: draggable }).addTo(map);
        marker.on('dragend', () => {
          const p = marker.getLatLng();
          if (onMoveRef.current) onMoveRef.current({ lat: p.lat, lng: p.lng });
        });
        mapRef.current = map;
        markerRef.current = marker;
        // 모달 애니메이션 등으로 컨테이너 크기가 늦게 잡히는 경우 대비
        setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 200);
      } else {
        mapRef.current.setView([lat, lng], mapRef.current.getZoom());
        markerRef.current.setLatLng([lat, lng]);
      }
    }).catch(() => { if (!cancelled) setFailed(true); });
    return () => { cancelled = true; };
  }, [lat, lng, hasCoords, draggable]);

  // 언마운트 시 Leaflet 인스턴스 정리
  useEffect(() => () => {
    if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; markerRef.current = null; }
  }, []);

  if (!hasCoords || failed) return <MapPreview lat={hasCoords ? lat : 34.95} lng={hasCoords ? lng : 127.49} label={label} height={height} />;

  return (
    // isolation: Leaflet 내부 z-index(400~1000)가 하단 탭바·모달 위로 올라오지 않도록 격리
    <div style={{ position: 'relative', width: '100%', height: `${height / 16}rem`, isolation: 'isolate', background: '#eef3ec' }}>
      <div ref={elRef} role="img" aria-label={`${label} 위치 지도`} style={{ position: 'absolute', inset: 0 }} />
    </div>
  );
}

  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const onSelectRef = useRef(onSelect);
  onSelectRef.current = onSelect;
  const [failed, setFailed] = useState(false);
  const pts = shops.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));
  const key = pts.map(s => s.id).join(',') + '|' + (selectedId || '');
  useEffect(() => {
    let cancelled = false;
    loadLeaflet().then((L) => {
      if (cancelled || !elRef.current) return;
      if (!mapRef.current) {
        mapRef.current = L.map(elRef.current, { scrollWheelZoom: false }).setView([34.95, 127.505], 12);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>'
        }).addTo(mapRef.current);
        layerRef.current = L.layerGroup().addTo(mapRef.current);
        setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 200);
      }
      layerRef.current.clearLayers();
      pts.forEach((s) => {
        const on = s.id === selectedId;
        const icon = L.divIcon({ className: '', html: `<div style="font-size:${on ? 30 : 24}px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))">📍</div>`, iconSize: [24, 24], iconAnchor: [12, 24] });
        L.marker([s.lat, s.lng], { icon, title: s.name, keyboard: true, zIndexOffset: on ? 1000 : 0 }).addTo(layerRef.current).on('click', () => onSelectRef.current(s.id));
      });
      if (pts.length && !selectedId) mapRef.current.fitBounds(L.latLngBounds(pts.map(s => [s.lat, s.lng])), { padding: [24, 24], maxZoom: 15 });
    }).catch(() => { if (!cancelled) setFailed(true); });
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [key]);
  useEffect(() => () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } }, []);
  return (
    <div>
      {!failed && (
        <div style={{ position: 'relative', width: '100%', height: `${height / 16}rem`, isolation: 'isolate', background: '#eef3ec' }} className="rounded-2xl overflow-hidden border border-slate-200">
          <div ref={elRef} role="application" aria-label="매장 위치 지도" style={{ position: 'absolute', inset: 0 }} />
        </div>
      )}
      {failed && <p className="text-xs text-slate-500 bg-slate-50 rounded-xl p-3">지도를 불러오지 못해 매장 목록으로 보여드려요.</p>}
      {/* 키보드·지도 실패 대비: 지도에 표시된 매장 버튼 */}
      <div className="flex flex-wrap gap-1.5 mt-2" aria-label="지도에 표시된 매장">
        {pts.map(s => (
          <button key={s.id} onClick={() => onSelect(s.id)} aria-pressed={s.id === selectedId} className="px-2.5 py-1 rounded-full border text-xs font-bold" style={s.id === selectedId ? { background: PINK, borderColor: PINK, color: 'white' } : { background: 'white', borderColor: '#e2e8f0', color: '#475569' }}>📍 {s.name}</button>
        ))}
      </div>
    </div>
  );
}

// SVG 약도 (지도 로드 실패 시 대체용)
function MapPreview({ lat, lng, label, height = 150 }) {
  // 좌표를 시드로 사용해 도로/구획을 살짝 다르게 배치 (매장마다 다른 느낌)
  const seed = Math.abs(Math.round((lat + lng) * 1000)) % 100;
  return (
    <div style={{ position: 'relative', width: '100%', height: `${height / 16}rem`, background: '#eaf2ea', overflow: 'hidden' }}>
      <svg viewBox="0 0 400 150" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
        <rect width="400" height="150" fill="#eef3ec" />
        <rect x="0" y={20 + (seed % 20)} width="400" height="14" fill="#dbe6f5" opacity="0.7" />
        <rect x={40 + (seed % 30)} y="0" width="10" height="150" fill="#ffffff" stroke="#e2e8f0" strokeWidth="2" />
        <rect x={180 - (seed % 20)} y="0" width="14" height="150" fill="#ffffff" stroke="#e2e8f0" strokeWidth="2" />
        <rect x="0" y="90" width="400" height="10" fill="#ffffff" stroke="#e2e8f0" strokeWidth="2" />
        <rect x={250 + (seed % 15)} y={60 + (seed % 15)} width="55" height="35" rx="4" fill="#d9e8d9" opacity="0.8" />
        <rect x={90 - (seed % 10)} y={100 + (seed % 10)} width="40" height="28" rx="4" fill="#d9e8d9" opacity="0.8" />
      </svg>
      <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -100%)', textAlign: 'center' }}>
        <div style={{ fontSize: '1.75rem', filter: 'drop-shadow(0 2px 2px rgba(0,0,0,0.25))' }}>📍</div>

      <div style={{ position: 'absolute', bottom: '0.375rem', left: '0.5rem', fontSize: '0.625rem', fontWeight: 700, color: '#64748b', background: 'rgba(255,255,255,0.85)', padding: '0.125rem 0.375rem', borderRadius: '0.375rem' }}>
        {label}
      </div>
    </div>
  );
}

// ───────────── 브라우저 저장소 ─────────────
// ⚠️ 프로토타입용: 데이터가 "이 브라우저"에만 저장됨. 상용화 시 서버 DB(예: Supabase/Firebase/자체 API)로 교체.
const STORE_PREFIX = 'nailmohae.v1.';
const storage = {
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem(STORE_PREFIX + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { window.localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); return true; } catch (e) { return false; }
  },
  remove(key) {
    try { window.localStorage.removeItem(STORE_PREFIX + key); } catch (e) { /* noop */ }
  },
  clearAll() {
    try {
      Object.keys(window.localStorage).filter(k => k.startsWith(STORE_PREFIX)).forEach(k => window.localStorage.removeItem(k));
      window.sessionStorage.removeItem(STORE_PREFIX + 'session');
    } catch (e) { /* noop */ }
  }
};

// 저장 데이터 버전. 기본 샵/디자인 데이터가 바뀌면 올리고 migrateStorage 에 처리 추가.
const DATA_VERSION = 4;
// 예전 버전으로 저장된 브라우저 데이터에 새 기본 데이터(신규 업종 샵·상품, 승인 상태)를 합쳐 넣음. 사용자가 만든 데이터는 유지.
function migrateStorage() {
  const v = storage.get('dataVersion', 0);
  if (v >= DATA_VERSION) return;
  const savedShops = storage.get('shops', null);
  if (savedShops) {
    const ids = new Set(savedShops.map(s => s.id));
    const initialIds = new Set(INITIAL_SHOPS.map(s => s.id));
    const merged = savedShops
      .map(s => (initialIds.has(s.id) && !s.status ? { ...s, status: 'approved' } : s))
      .concat(INITIAL_SHOPS.filter(s => !ids.has(s.id)).map(s => ({ bizType: 'nail', status: 'approved', ...s })));
    storage.set('shops', merged);
  }
  const savedDesigns = storage.get('designs', null);
  if (savedDesigns) {
    const ids = new Set(savedDesigns.map(d => d.id));
    storage.set('designs', savedDesigns.concat(INITIAL_DESIGNS.filter(d => !ids.has(d.id))));
  }
  // v4: 예전 시드 예약(가상 고객 u_seed)을 새 배정(김네일·이서연·박하늘)으로 맞춤 — 확정 상태인 것만
  if (v < 4 && DEMO_MODE) {
    const saved = storage.get('bookings', null);
    if (saved) {
      const fresh = Object.fromEntries(makeSeedBookings().map(b => [b.id, b]));
      storage.set('bookings', saved.map(b => (b.seeded && fresh[b.id] && b.status === 'confirmed' ? { ...b, userId: fresh[b.id].userId, userName: fresh[b.id].userName } : b)).concat(saved.some(b => b.id === 'b_seed6') ? [] : [fresh.b_seed6]));
    }
  }
  storage.set('dataVersion', DATA_VERSION);
}
function usePersistentState(key, initial) {
  const [value, setValue] = useState(() => storage.get(key, typeof initial === 'function' ? initial() : initial));
  useEffect(() => {
    // 저장 실패(용량 초과·저장소 차단) 시 앱에 알려서 사용자에게 안내
    if (!storage.set(key, value)) {
      try { window.dispatchEvent(new CustomEvent('nailmohae:storage-error', { detail: key })); } catch (e) { /* noop */ }
    }
  }, [key, value]);
  return [value, setValue];
}

// ───────────── 인증 / 검증 유틸 ─────────────
const onlyDigits = (s) => String(s || '').replace(/\D/g, '');

function formatPhone(s) {
  const d = onlyDigits(s).slice(0, 11);
  if (d.length < 4) return d;
  if (d.length < 8) return `${d.slice(0, 3)}-${d.slice(3)}`;
  return `${d.slice(0, 3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}`;
}
const isValidPhone = (s) => /^01[016789]\d{7,8}$/.test(onlyDigits(s));
const isValidEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim());

function formatBizNo(s) {
  const d = onlyDigits(s).slice(0, 10);
  if (d.length <= 3) return d;
  if (d.length <= 5) return `${d.slice(0, 3)}-${d.slice(3)}`;
  return `${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5)}`;
}
// 사업자등록번호 체크섬(국세청 공개 알고리즘). 형식 검증일 뿐, 실제 영업 상태 확인은 백엔드에서 국세청 API로 해야 함.
function isValidBizNo(s) {
  const d = onlyDigits(s);
  if (d.length !== 10) return false;
  const w = [1, 3, 7, 1, 3, 7, 1, 3, 5];
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += Number(d[i]) * w[i];
  sum += Math.floor((Number(d[8]) * 5) / 10);
  return (10 - (sum % 10)) % 10 === Number(d[9]);
}
// 통신판매업 신고번호 예: 제2026-전남순천-0123호
const isValidMailOrderNo = (s) => /^제?\d{4}-[가-힣A-Za-z0-9]{2,15}-\d{3,6}호?$/.test(String(s || '').replace(/\s/g, ''));

function passwordIssue(pw) {
  if (!pw || pw.length < 8) return '비밀번호는 8자 이상이어야 해요.';
  if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return '영문과 숫자를 함께 사용해주세요.';
  return '';
}

const maskName = (name) => (name ? `${name.charAt(0)}**` : '회원');

const toHex = (buf) => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
function randomHex(bytes) {
  const a = new Uint8Array(bytes);
  window.crypto.getRandomValues(a);
  return toHex(a);
}
// 비밀번호는 평문 저장 금지 — PBKDF2(SHA-256, 10만 회)로 해시해서 저장
async function hashPassword(password, saltHex) {
  if (!(window.crypto && window.crypto.subtle)) throw new Error('no-webcrypto');
  const enc = new TextEncoder();
  const key = await window.crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const salt = new Uint8Array(saltHex.match(/../g).map(h => parseInt(h, 16)));

}

// 영업시간 문구에서 정기 휴무 요일 추출: "(월요일 휴무)" → [1]
function closedWeekdays(hours) {

const toMin = (hhmm) => { const [h, m] = String(hhmm || '0:0').split(':').map(Number); return h * 60 + (m || 0); };

// 매장의 하루 일정. 원장님이 샵프로필에서 정한 요일별 영업시간·임시 휴무·예약 마감 시간을 우선 사용하고,
// 없으면 영업시간 문구("10:00 - 20:00 (월요일 휴무)")를 읽음.
function shopDaySchedule(shop, dateKey) {
  const s = shop || {};
  if ((s.tempClosures || []).some(c => dateKey >= c.from && dateKey <= (c.to || c.from))) return { closed: true, reason: '임시 휴무' };
  const wd = weekdayOf(dateKey);
  const wh = s.weeklyHours && s.weeklyHours[wd];
  if (wh) {
    if (wh.closed) return { closed: true, reason: '휴무' };
    return { closed: false, open: wh.open, close: wh.close, lastStart: s.lastBookingTime || null };
  }
  if (closedWeekdays(s.hours).includes(wd)) return { closed: true, reason: '휴무' };
  const m = String(s.hours || '').match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
  return { closed: false, open: m ? m[1] : '00:00', close: m ? m[2] : '23:59', lastStart: s.lastBookingTime || null };
}

function shopClosureText(shop) {

  const google = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${f(start)}/${f(end)}&ctz=Asia/Seoul&details=${encodeURIComponent(details)}&location=${encodeURIComponent(loc)}`;

  return { google, ics, fileName: `nailmohae-${b.date}-${b.time.replace(':', '')}.ics` };

// 디자이너가 그날·그 시간에 일할 수 있고 해당 상품을 시술할 수 있는지 (원장님이 디자이너 관리에서 설정)
function staffCanWork(member, dateKey, time, durationMin, designId) {
  if (!member || member.active === false) return { ok: false, reason: '디자이너 없음' };
  if ((member.offDays || []).includes(weekdayOf(dateKey))) return { ok: false, reason: '디자이너 휴무' };
  if (member.workStart && toMin(time) < toMin(member.workStart)) return { ok: false, reason: '근무 시간 외' };
  if (member.workEnd && toMin(time) + durationMin > toMin(member.workEnd)) return { ok: false, reason: '근무 시간 외' };
  if (designId && (member.designIds || []).length && !member.designIds.includes(designId)) return { ok: false, reason: '시술 불가' };
  return { ok: true };
}

// 중복 예약 방지 핵심 로직 (3차: 시간 구간 겹침 기준).
// 예약 = [시작, 시작+소요 시간) 구간. 같은 디자이너의 확정 예약과 구간이 겹치면 막고(옵션으로 시간이 늘어 다음 예약과 겹치는 경우 포함),
// 고객 본인의 다른 확정 예약과 겹쳐도 막음. excludeId: 예약 변경 시 자기 자신 제외.
// ⚠️ 실서비스에서는 서버에서 트랜잭션·겹침 검사로 한 번 더 막아야 함.
function checkSlot(bookings, { shop, shopId, designerId, date, time, userId, hours, staff: staffList, durationMin, designId, excludeId }) {
  const sched = shopDaySchedule(shop || { hours }, date);
  if (sched.closed) return { ok: false, reason: sched.reason };
  if (slotTime(date, time) - Date.now() < BOOKING_LEAD_MS) return { ok: false, reason: '마감' };
  if (toMin(time) < toMin(sched.open) || toMin(time) >= toMin(sched.close)) return { ok: false, reason: '영업시간 외' };
  if (sched.lastStart && toMin(time) > toMin(sched.lastStart)) return { ok: false, reason: '예약 마감 시간' };
  const dur = durationMin || DEFAULT_BOOKING_MIN;
  const start = slotTime(date, time);
  const end = start + dur * 60000;
  const overlaps = (b) => {
    if (b.status !== 'confirmed' || b.id === excludeId || b.date !== date) return false;
    const bs = slotTime(b.date, b.time);
    const be = bs + (b.durationMin || DEFAULT_BOOKING_MIN) * 60000;
    return bs < end && start < be;
  };
  const clashing = bookings.filter(overlaps);
  if (userId && clashing.some(b => b.userId === userId)) return { ok: false, reason: '내 예약 있음' };
  const atShop = clashing.filter(b => b.shopId === shopId);
  const staff = (staffList || SHOP_STAFF[shopId] || []).filter(s => s.active !== false);
  if (designerId) {
    const member = staff.find(s => s.id === designerId);
    const can = staffCanWork(member, date, time, dur, designId);
    if (!can.ok) return can;
    return atShop.some(b => b.designerId === designerId) ? { ok: false, reason: '예약 마감' } : { ok: true, designerId };
  }
  if (staff.length === 0) return atShop.length ? { ok: false, reason: '예약 마감' } : { ok: true, designerId: null };
  const free = staff.find(s => staffCanWork(s, date, time, dur, designId).ok && !atShop.some(b => b.designerId === s.id));
  return free ? { ok: true, designerId: free.id } : { ok: false, reason: '예약 마감' };
}

// ───────────── 검색 ─────────────
const squash = (s) => String(s || '').toLowerCase().replace(/\s+/g, '');
// 검색에서 무시하는 일반 단어 ("조례동 네일샵" → "조례동"으로 검색). 검색어가 전부 일반 단어면 그대로 사용
const SEARCH_STOPWORDS = ['네일샵', '네일숍', '샵', '숍', '가게', '매장', '곳', '추천', '근처', '잘하는', '잘하는곳', '예약', '순천'];
function searchTokens(query) {
  const all = String(query || '').toLowerCase().split(/\s+/).filter(Boolean).map(squash).filter(Boolean);
  const meaningful = all.filter(t => !SEARCH_STOPWORDS.includes(t));
  return { tokens: meaningful.length ? meaningful : all, ignored: meaningful.length ? all.filter(t => SEARCH_STOPWORDS.includes(t)) : [] };
}
// 띄어쓰기로 나눈 단어 중 하나라도 맞으면 결과에 포함. 모두 맞으면 all=true (목록 위쪽), 첫 필드(제목·상호) 일치에 가중치
function searchMatch(fields, query) {
  const { tokens } = searchTokens(query);
  if (!tokens.length) return { matched: 0, all: false, score: 0 };
  const hay = fields.map(squash);
  let matched = 0;
  let score = 0;
  for (const t of tokens) {
    const idx = hay.findIndex(h => h.includes(t));
    if (idx < 0) continue;
    matched += 1;
    score += idx === 0 ? 3 : 1;
  }
  return { matched, all: matched === tokens.length, score };
}
const bySearchRank = (a, b) => (Number(b.m.all) - Number(a.m.all)) || (b.m.matched - a.m.matched) || (b.m.score - a.m.score);
// 광고 키워드 일치: 의미 있는 검색 단어가 광고 키워드에 들어 있거나, 광고 키워드 단어가 검색어에 들어 있으면 일치
function adKeywordMatches(keyword, query) {
  if (!keyword || !query) return false;
  const kw = searchTokens(keyword).tokens;
  const qt = searchTokens(query).tokens;
  const kwAll = squash(keyword);
  const qAll = squash(query);
  return qt.some(t => kwAll.includes(t)) || kw.some(t => qAll.includes(t));
}

// ───────────── 이미지 최적화 ─────────────
// Unsplash 이미지는 표시 크기에 맞춰 w/h 파라미터를 줄여 요청 (600px 원본 → 썸네일은 160px 등)
function sizedSrc(url, px) {
  if (!url || !/images\.unsplash\.com/.test(url)) return url;
  const w = Math.min(1200, Math.round(px));
  return url.replace(/([?&])w=\d+/, `$1w=${w}`).replace(/([?&])h=\d+/, `$1h=${w}`);
}

// 업로드 사진을 최대 1080px JPEG로 줄여 저장 (용량 수 MB → 수백 KB)
function compressImage(file, maxSize = 1080, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        try {
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (e) { resolve(reader.result); }
      };
      img.onerror = () => resolve(reader.result);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
const MAX_UPLOAD_BYTES = 15 * 1024 * 1024;

const scriptPromises = {};
function loadScriptOnce(src) {
  if (scriptPromises[src]) return scriptPromises[src];
  scriptPromises[src] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => { delete scriptPromises[src]; reject(new Error('script-load-failed')); };

  };
  const onMouseDown = (e) => {
    if (e.button !== 0 || !ref.current) return;
    drag.current = { x: e.clientX, left: ref.current.scrollLeft, moved: false };
    const move = (ev) => {
      const d = drag.current;
      const el = ref.current;
      if (!d || !el) return;
      const dx = ev.clientX - d.x;
      if (!d.moved && Math.abs(dx) > 5) { d.moved = true; el.style.scrollSnapType = 'none'; el.style.cursor = 'grabbing'; }
      if (d.moved) el.scrollLeft = d.left - dx;
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      const el = ref.current;
      if (el) { el.style.cursor = ''; el.style.scrollSnapType = snapType; }
      setTimeout(() => { drag.current = null; }, 0); // 드래그 직후 click 이 카드 열기로 이어지지 않게 한 틱 유지
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };
  const onClickCapture = (e) => {
    if (drag.current && drag.current.moved) { e.preventDefault(); e.stopPropagation(); }
  };
  return (
    <div className="nm-hrow relative">
      <div
        ref={ref}
        className={`hscroll overflow-x-auto ${className}`}
        style={{ scrollSnapType: snapType || undefined, ...style }}
        onMouseDown={onMouseDown}
        onClickCapture={onClickCapture}
        onDragStart={(e) => e.preventDefault()}
        {...rest}
      >
        {children}
      </div>
      {edges.left && <button type="button" className="nm-hbtn" style={{ left: '0.25rem' }} aria-label="왼쪽으로 넘기기" onClick={() => step(-1)}>‹</button>}
      {edges.right && <button type="button" className="nm-hbtn" style={{ right: '0.25rem' }} aria-label="오른쪽으로 넘기기" onClick={() => step(1)}>›</button>}
    </div>
  );
}

function NailSwatch({ colorA, colorB, pattern, className, style }) {

      <defs>
        <linearGradient id={uid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor={colorA} />
          <stop offset="1" stopColor={colorB} />
        </linearGradient>
      </defs>
      <rect width="100" height="100" fill={`url(#${uid})`} />
      {pattern === 'brow' ? (
        // 눈썹문신: 양쪽 눈썹 곡선 + 눈매 라인
        <g fill="none" strokeLinecap="round">
          <path d="M16 46 Q 30 33 46 41" stroke="rgba(90,60,40,0.55)" strokeWidth="5" />
          <path d="M54 41 Q 70 33 84 46" stroke="rgba(90,60,40,0.55)" strokeWidth="5" />

          <path d="M58 60 Q 68 54 78 60" stroke="rgba(255,255,255,0.75)" strokeWidth="2.5" />
        </g>
      ) : pattern === 'scalp' ? (
        // 두피관리: 머리 실루엣 + 물방울
        <g>
          <path d="M28 70 Q 28 30 50 28 Q 72 30 72 70 Z" fill="rgba(255,255,255,0.45)" />
          <path d="M36 40 Q 42 34 48 38 M52 36 Q 58 32 64 40" stroke="rgba(255,255,255,0.9)" strokeWidth="2.5" fill="none" strokeLinecap="round" />
          <circle cx="24" cy="30" r="3" fill="rgba(255,255,255,0.8)" /><circle cx="78" cy="26" r="2.2" fill="rgba(255,255,255,0.8)" /><circle cx="82" cy="40" r="1.6" fill="rgba(255,255,255,0.8)" />
        </g>
      ) : (
        <g fill="rgba(255,255,255,0.4)">
          <rect x="18" y="34" width="17" height="42" rx="8.5" />
          <rect x="41.5" y="20" width="17" height="56" rx="8.5" />

      {pattern === 'glitter' && (
        <g fill="white" opacity="0.9">

          <circle cx="47" cy="52" r="1.3" /><circle cx="72" cy="46" r="1.6" /><circle cx="76" cy="60" r="1.2" />

          <path d="M20 40 Q 28 50 22 62" /><path d="M48 25 Q 55 40 46 58" /><path d="M70 40 Q 78 52 72 68" />
        </g>
      )}
    </svg>
  );
}

// size: 화면에 표시되는 대략적인 가로 px. 2배 해상도까지 srcSet 으로 제공.
function Visual({ item, className, style, size = 240, eager = false }) {
  const [imgError, setImgError] = useState(false);
  const label = item.title || item.name || '네일 디자인';
  if (imgError || !item.img) {
    return (
      <span role="img" aria-label={label} className={className} style={{ display: 'block', overflow: 'hidden', ...style }}>
        <NailSwatch colorA={item.colorA} colorB={item.colorB} pattern={item.pattern || 'plain'} className="w-full h-full" />
      </span>
    );
  }
  const isRemote = /^https?:/.test(item.img);
  return (
    <img
      src={isRemote ? sizedSrc(item.img, size) : item.img}
      srcSet={isRemote ? `${sizedSrc(item.img, size)} 1x, ${sizedSrc(item.img, size * 2)} 2x` : undefined}
      alt={label}
      loading={eager ? 'eager' : 'lazy'}
      decoding="async"
      className={className}
      style={{ objectFit: 'cover', ...style }}
      onError={() => setImgError(true)}
    />
  );
}

// 디자인 상세 사진 넘기기: 좌우로 밀거나(터치·드래그 스크롤) 점·화살표 버튼으로 이동. 사진 1장이면 그대로 표시
function PhotoCarousel({ item, images, size = 430 }) {
  const ref = useRef(null);
  const [idx, setIdx] = useState(0);
  if (images.length <= 1) return <Visual item={item} className="w-full h-full" size={size} eager />;
  const onScroll = () => { const el = ref.current; if (el && el.clientWidth) setIdx(Math.round(el.scrollLeft / el.clientWidth)); };
  const go = (i) => {
    const k = Math.max(0, Math.min(images.length - 1, i));
    const el = ref.current;
    if (el && el.scrollTo) el.scrollTo({ left: k * el.clientWidth, behavior: 'smooth' });
    setIdx(k);
  };
  return (
    <div className="nm-hrow relative w-full h-full">
      <div ref={ref} onScroll={onScroll} role="region" aria-label={`사진 ${images.length}장 중 ${idx + 1}번째`} className="flex w-full h-full overflow-x-auto" style={{ scrollSnapType: 'x mandatory', scrollbarWidth: 'none' }}>
        {images.map((src, i) => (
          <div key={i} className="w-full h-full shrink-0" style={{ scrollSnapAlign: 'start' }}>
            <Visual item={{ ...item, img: src }} className="w-full h-full" size={size} eager={i === 0} />
          </div>
        ))}
      </div>
      {idx > 0 && <button type="button" className="nm-hbtn" style={{ left: '0.5rem' }} aria-label="이전 사진" onClick={() => go(idx - 1)}>‹</button>}
      {idx < images.length - 1 && <button type="button" className="nm-hbtn" style={{ right: '0.5rem' }} aria-label="다음 사진" onClick={() => go(idx + 1)}>›</button>}
      <div className="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5">
        {images.map((_, i) => (
          <button key={i} type="button" aria-label={`${i + 1}번째 사진 보기`} aria-current={i === idx ? 'true' : undefined} onClick={() => go(i)} className="w-2 h-2 rounded-full shadow" style={{ background: i === idx ? 'white' : 'rgba(255,255,255,0.55)' }} />
        ))}
      </div>
    </div>
  );
}

          phone: formatPhone(f.phone), rating: 0, reviews: 0, info: '매장 소개를 입력해주세요.', isPremium: false,
          colorA: '#fde2e4', colorB: '#e2ece9', img: '', lat: undefined, lng: undefined,
          status: 'pending', appliedAt: Date.now(), ownerId: id
        }]);
        notify('admin', `🏬 입점 신청: ${f.shopName.trim()} (${f.ceoName.trim()})`);
        setShopOwnerData(prev => ({ ...prev, [shopId]: { credit: 0, bankInfo: null, ads: [] } }));
        // 매장 주소로 지도 좌표 찾기 (실패해도 가입은 진행, 샵프로필에서 핀 지정 가능)
        geocodeAddress(f.bizAddress).then(r => {
          if (r) setShops(prev => prev.map(s => s.id === shopId ? { ...s, lat: r.lat, lng: r.lng } : s));
        }).catch(() => {});
      }
      setAccounts(prev => [...prev, acc]);
      startSession(acc, true);
      notify(acc.id, `🎉 ${acc.name}님, 가입을 환영해요! 신규 회원 쿠폰이 지급되었어요.`, null, 'system');
      setSignupForm(EMPTY_SIGNUP);
      setAgree({ terms: false, privacy: false, age14: false, marketing: false });
      showToast(signupType === 'owner' ? '가입 완료! 사업자 정보 확인 후 매장이 노출돼요.' : '가입이 완료되었어요!');
    } catch (err2) {
      setSignupErrors({ agree: '이 브라우저에서는 안전한 가입을 진행할 수 없어요. (https 접속 필요)' });
    } finally {
      setAuthBusy(false);
    }
  };

  const handleLogin = async (e) => {
    e.preventDefault();
    if (authBusy) return;
    const phone = onlyDigits(loginForm.phone);
    if (!phone || !loginForm.password) { setLoginError('휴대폰번호와 비밀번호를 입력해주세요.'); return; }
    const fail = loginFails[phone];
    if (fail && fail.until && fail.until > Date.now()) {
      const min = Math.ceil((fail.until - Date.now()) / 60000);
      setLoginError(`로그인 시도가 많아 잠시 잠겼어요. ${min}분 후 다시 시도해주세요.`);
      return;
    }
    setAuthBusy(true);
    try {
      if (accounts.some(a => a.phone === phone && a.status === 'withdrawn') && !accounts.some(a => a.phone === phone && a.status !== 'withdrawn')) {
        setLoginError('탈퇴한 계정이라 로그인할 수 없어요. 새로 가입해 주세요.');
        return;
      }
      const acc = accounts.find(a => a.phone === phone && a.status !== 'withdrawn' && !a.virtual);
      const ok = acc ? (await hashPassword(loginForm.password, acc.salt)) === acc.hash : false;
      if (!ok) {
        // 잠금이 풀린 뒤에는 0부터 다시 셈
        const prevCount = fail && !fail.until ? (fail.count || 0) : 0;
        const count = prevCount + 1;
        const locked = count >= LOGIN_MAX_FAILS;
        setLoginFails(prev => ({ ...prev, [phone]: { count, until: locked ? Date.now() + LOGIN_LOCK_MS : 0 } }));
        // 계정 존재 여부를 노출하지 않도록 같은 문구 사용
        setLoginError(locked ? '비밀번호를 5회 잘못 입력해 5분간 로그인이 제한돼요.' : `휴대폰번호 또는 비밀번호가 올바르지 않아요. (${count}/${LOGIN_MAX_FAILS})`);
        return;
      }
      setLoginFails(prev => { const next = { ...prev }; delete next[phone]; return next; });
      setLoginError('');
      startSession(acc, keepLogin);
    } catch (err) {
      setLoginError('이 브라우저에서는 로그인을 처리할 수 없어요. (https 접속 필요)');
    } finally {
      setAuthBusy(false);
    }
  };

  const updateMarketing = (on) => {
    setAccounts(prev => prev.map(a => a.id === uid ? { ...a, marketing: on, agreedAt: { ...(a.agreedAt || {}), marketing: on ? Date.now() : null } } : a));
    setCurrentUser(u => ({ ...u, marketing: on }));
    showToast(on ? '마케팅 정보 수신에 동의했어요.' : '마케팅 정보 수신 동의를 철회했어요.');
  };

  const resetDemoData = async () => {
    if (!(await askConfirm({ title: '시연 데이터 초기화', message: '이 브라우저에 저장된 모든 계정·예약·데이터를 지우고 처음 상태로 되돌릴까요?', confirmText: '초기화', danger: true }))) return;
    storage.clearAll();
    window.location.reload();
  };

  // ── 예약 ──
  const [selectedOptionIds, setSelectedOptionIds] = useState([]);
  const [bookingRequest, setBookingRequest] = useState('');
  const resetBookingFlow = () => {
    setBookingStep(0);
    setSelectedOptionIds([]);
    setBookingRequest('');
    setSelectedDate('');
    setSelectedTime('');
    setSelectedDesigner(null);
    setPaying(false);
  };

  const confirmBooking = async (design) => {
    if (paying) return;
    if (isPreview) { previewGuard(); return; }
    if (myRestriction) { showToast(`이용이 제한된 계정이라 예약할 수 없어요. (사유: ${myRestriction.reason})`); return; }
    if (noShowCount(uid) >= NOSHOW_POLICY.blockAt) { showToast('노쇼 누적으로 예약이 제한된 계정이에요.'); return; }
    const shop = shops.find(s => s.id === design.shopId);
    const totals = bookingTotals(design, selectedOptionIds);
    const params = { shop, shopId: design.shopId, designerId: selectedDesigner ? selectedDesigner.id : null, date: selectedDate, time: selectedTime, userId: uid, hours: shop && shop.hours, staff: staffOf(design.shopId), durationMin: totals.duration, designId: design.id };
    const before = checkSlot(bookings, params);
    if (!before.ok) {
      showToast(`앗, 방금 이 시간이 마감됐어요 (${before.reason}). 다른 시간을 골라주세요.`);
      setSelectedTime('');
      setBookingStep(1);
      return;
    }
    setPaying(true);
    const pay = await requestDepositPayment({
      orderName: `[네일뭐해] ${design.title} 예약금`,
      amount: PAYMENT_CONFIG.depositAmount,
      customer: { name: currentUser.name, phone: formatPhone(currentUser.phone) }
    });
    if (!pay.ok) {
      setPaying(false);
      showToast(pay.message);
      return;
    }
    // 결제하는 동안 같은 슬롯이 잡혔는지 최신 예약 원장으로 최종 확인 (실서비스: 서버 트랜잭션으로 처리)
    const again = checkSlot(bookingsRef.current, params);
    if (!again.ok) {
      setPaying(false);
      setBookingStep(1);
      setSelectedTime('');
      showToast('결제 중 해당 시간이 마감되어 예약이 확정되지 않았어요. 예약금은 자동 환불됩니다.');
      return;
    }
    const created = {
      id: 'b_' + Date.now(), userId: uid, userName: maskName(currentUser.name), shopId: design.shopId,
      designerId: again.designerId, designId: design.id, date: selectedDate, time: selectedTime,
      status: 'confirmed', paymentId: pay.paymentId, deposit: PAYMENT_CONFIG.depositAmount,
      price: design.price, optionPrice: totals.optionPrice, finalPrice: totals.final, durationMin: totals.duration,
      options: totals.opts.map(o => ({ id: o.id, name: o.name, price: Number(o.price) || 0, minutes: Number(o.minutes) || 0 })),
      request: bookingRequest.trim(),
      couponId: appliedCoupon ? appliedCoupon.id : null, pointsEarned: 100, createdAt: Date.now()
    };
    bookingsRef.current = [...bookingsRef.current, created];
    setBookings(prev => [...prev, created]);
    if (adClickRef.current[design.id]) { bumpAd(adClickRef.current[design.id], 'conv'); delete adClickRef.current[design.id]; }
    const staff = staffOf(design.shopId).find(s => s.id === created.designerId);
    const when = `${formatDateLabel(created.date)} ${created.time}`;
    notify(uid, `✅ 예약 확정: ${design.shopName} · ${when}${staff ? ` (${staff.name})` : ''}`);
    notify('shop:' + design.shopId, `📅 새 예약: ${created.userName} 고객 · ${design.title} · ${when}${staff ? ` · ${staff.name}` : ''}`);
    if (appliedCoupon) setMyCoupons(myCoupons.map(c => c.id === appliedCoupon.id ? { ...c, used: true } : c));
    setAppliedCouponId(null);
    setMyPoints(myPoints + 100);
    if (appliedCoupon) addPointLog(uid, 'coupon', `‘${appliedCoupon.name}’ 사용`, `예약 ${design.shopName}`);
    addPointLog(uid, 'point', '+100P', `예약 적립 · ${design.shopName}`);
    setLastBooking(created);
    setPaying(false);
    setBookingStep(3);
  };

  // 미리보기 모드에서 막힌 동작을 눌렀을 때 안내 + 고객 가입 화면으로 가는 링크
  // 원장님·관리자 화면 ↔ 고객 화면(미리보기) 전환. 버튼: 원장님·관리자 헤더, 미리보기 띠
  const switchMode = (mode) => { setAppMode(mode); resetBookingFlow(); setSelectedDesign(null); setSelectedShop(null); setShowNotifications(false); };
  // 배지 부여 기준 안내 (관리자만 부여)
  const showBadgeInfo = (key) => {
    const b = SHOP_BADGES[key];
    askConfirm({ title: b.label, message: `${b.criteria}\n\n이 배지는 매장이 직접 켜는 값이 아니라 운영팀이 확인 후 부여해요.`, confirmText: '확인', infoOnly: true });
  };
  // 관리자: 배지 부여·회수 (사유 필수, 처리 이력)
  const adminToggleBadge = async (shop, key) => {
    const cur = shopBadgesOf(shop);
    const on = !cur[key];
    const reason = await askReason({ title: `${SHOP_BADGES[key].label} 배지 ${on ? '부여' : '회수'}`, message: SHOP_BADGES[key].criteria, confirmText: on ? '부여' : '회수' });
    if (!reason) return;
    setShops(prev => prev.map(s => (s.id === shop.id ? { ...s, badges: { ...cur, [key]: on } } : s)));
    logAdmin({ targetType: 'shop', targetId: shop.id, targetName: shop.name, field: `${SHOP_BADGES[key].label} 배지`, before: on ? '없음' : '부여', after: on ? '부여' : '회수', reason });
    notify('shop:' + shop.id, `‘${SHOP_BADGES[key].label}’ 배지가 ${on ? '부여' : '회수'}되었어요. (사유: ${reason})`);
  };
  const goCustomerSignup = () => {
    logout();
    setAuthView('signup');
    setSignupType('customer');
    setSignupErrors({});
  };
  const previewGuard = async () => {
    const who = currentUser && currentUser.type === 'admin' ? '관리자' : '원장님';
    const ok = await askConfirm({
      title: '미리보기 모드',
      message: `${who} 계정은 고객 화면을 미리보기만 할 수 있어요.\n직접 예약하려면 고객용 계정으로 가입해 주세요.`,
      confirmText: '고객용 계정으로 가입하기',
      cancelText: '계속 미리보기'
    });
    if (ok) goCustomerSignup();
  };

  // 다른 회원(예약한 고객)의 쿠폰·포인트를 고칠 때 사용 — 원장님 취소·관리자 정정 등
  const defaultPointsFor = (userId) => (userId === 'u_demo_customer' ? 3200 : 1000);
  const patchUserDataFor = (userId, fn) => setUserData(prev => {
    const cur = prev[userId] || {};
    return { ...prev, [userId]: { ...cur, ...fn(cur) } };
  });
  const addPointLog = (userId, kind, change, reason) => patchUserDataFor(userId, (cur) => ({ pointLog: [{ id: 'pl_' + Date.now() + Math.random().toString(36).slice(2, 5), at: Date.now(), kind, change, reason }, ...(cur.pointLog || [])].slice(0, 200) }));
  const pointsOf = (d, userId) => (d.points != null ? d.points : defaultPointsFor(userId));

  // 예약 취소 공통 처리 (고객 앱 취소·원장님 취소 모두). reason: CANCEL_REASONS 키, by: 'customer' | 'owner'
  const applyCancel = (b, reason, memo, by) => {
    const out = cancelOutcome(b, reason);
    const r = CANCEL_REASONS[reason];
    setBookings(prev => prev.map(x => x.id === b.id ? {
      ...x, status: 'cancelled', cancelReason: reason, cancelMemo: memo || '', cancelledBy: by, cancelledAt: Date.now(),
      refunded: out.refund > 0, refundAmount: out.refund, settlementDeposit: out.settlementDeposit
    } : x));
    // 복구 내역은 현재 상태로 미리 계산(알림 문구에 쓰기 위해). 실제 반영은 최신 상태 기준으로 다시 계산
    const cur = userData[b.userId] || {};
    const restored = [];
    if (out.restoreCoupon && b.couponId && (cur.coupons || INITIAL_COUPONS).some(c => c.id === b.couponId && c.used)) restored.push('쿠폰 복구');
    if (out.reclaimPoints && b.pointsEarned) restored.push(`적립 ${b.pointsEarned}P 회수`);
    patchUserDataFor(b.userId, (d) => {
      const patch = {};
      const coupons = d.coupons || INITIAL_COUPONS;
      if (out.restoreCoupon && b.couponId && coupons.some(c => c.id === b.couponId && c.used)) {
        patch.coupons = coupons.map(c => c.id === b.couponId ? { ...c, used: false } : c);
      }
      if (out.reclaimPoints && b.pointsEarned) patch.points = Math.max(0, pointsOf(d, b.userId) - b.pointsEarned);
      return patch;
    });
    if (restored.includes('쿠폰 복구')) addPointLog(b.userId, 'coupon', '쿠폰 복구', '예약 취소');
    if (out.reclaimPoints && b.pointsEarned) addPointLog(b.userId, 'point', `-${b.pointsEarned}P`, '예약 취소로 적립 회수');
    const d = designs.find(x => x.id === b.designId);
    const s = shops.find(x => x.id === b.shopId);
    const when = `${formatDateLabel(b.date)} ${b.time}`;
    const refundText = out.refund > 0 ? `예약금 ${out.refund.toLocaleString()}원 환불` : '예약금 환불 없음(취소 규정)';
    if (out.apology) {
      notify(b.userId, `🙏 죄송해요. ${s ? s.name : '매장'} 사정으로 ${when} 예약이 취소되었어요 (사유: ${r.label}${memo ? ' - ' + memo : ''}). ${refundText}${restored.length ? ' · ' + restored.join(', ') : ''}`, { type: 'rebook', designId: b.designId, label: '다른 시간 예약하기' });
    } else {
      notify(b.userId, `예약이 취소되었어요 (${r.status}): ${when} · ${refundText}${restored.length ? ' · ' + restored.join(', ') : ''}`);
    }
    logBookingEvent(b, '예약 취소', `${r.status} · 환불 ${out.refund.toLocaleString()}원 · 정산 포함 ${out.settlementDeposit.toLocaleString()}원${memo ? ' · ' + memo : ''}`, by);
    notify('shop:' + b.shopId, `❌ 예약 취소 (${r.label}): ${b.userName} 고객 · ${d ? d.title : ''} · ${when}${out.settlementDeposit ? ` · 예약금 ${out.settlementDeposit.toLocaleString()}원 정산 포함` : ''}`);
    return { out, restored };
  };

  // 고객이 스케줄에서 직접 취소
  const cancelBooking = async (b) => {
    const out = cancelOutcome(b, 'customer_app');
    const ok = await askConfirm({
      title: '예약 취소',
      message: out.refund > 0
        ? `방문 ${CANCEL_FREE_HOURS}시간 전이라 예약금이 전액 환불돼요.`
        : `방문 ${CANCEL_FREE_HOURS}시간 이내라 예약금은 환불되지 않아요. 그래도 취소할까요?`,
      details: [['환불 예약금', `${out.refund.toLocaleString()}원`], ['쿠폰', b.couponId ? '다시 사용 가능' : '-'], ['예약 적립 포인트', b.pointsEarned ? `-${b.pointsEarned}P` : '-']],
      confirmText: '예약 취소', cancelText: '닫기', danger: true
    });
    if (!ok) return;
    const { restored } = applyCancel(b, 'customer_app', '', 'customer');
    showToast(`예약을 취소했어요${restored.length ? ' · ' + restored.join(', ') : ''}`);
  };

  // 원장님 예약 취소 (사유 선택 시트)
  const [ownerCancel, setOwnerCancel] = useState(null); // { booking, reason, memo }
  const submitOwnerCancel = async () => {
    if (!ownerCancel) return;
    const { booking: b, reason, memo } = ownerCancel;
    if (!reason) { showToast('취소 사유를 선택해주세요.'); return; }
    const out = cancelOutcome(b, reason);
    const ok = await askConfirm({
      title: '예약 취소 확정',
      message: '취소하면 되돌릴 수 없어요. 아래 내용으로 처리할까요?',
      details: [['사유', CANCEL_REASONS[reason].label], ['예약 금액(옵션 포함)', `${bookingPrice(b).toLocaleString()}원`], ['고객 환불', `${out.refund.toLocaleString()}원`], ['매장 정산 포함', `${out.settlementDeposit.toLocaleString()}원`], ['고객 쿠폰', b.couponId ? '복구' : '-']],
      confirmText: '예약 취소', cancelText: '돌아가기', danger: true
    });
    if (!ok) return;
    applyCancel(b, reason, memo.trim(), 'owner');
    setOwnerCancel(null);
    showToast('예약을 취소했어요. 고객에게 알림을 보냈어요.');
  };

  const completeBooking = (b) => {
    // [출시 전 점검] 지금은 시연을 위해 예약 시간 전에도 완료 처리 가능 (2차 요청서 13번: 현상유지)
    setBookings(prev => prev.map(x => x.id === b.id ? { ...x, status: 'completed', completedAt: Date.now() } : x));
    logBookingEvent(b, '시술 완료', `결제 예정 ${bookingPrice(b).toLocaleString()}원`, 'owner');
    notify(b.userId, '💅 시술이 완료되었어요! 후기를 남기면 300P를 드려요.', { type: 'review', bookingId: b.id, label: '후기 쓰기' }, 'review');
  };

  // 노쇼: 예약 시간이 지난 뒤에만. demoBypass 는 DEMO_MODE 시연 링크에서만 true
  const markNoShow = async (b, demoBypass = false) => {
    if (slotTime(b.date, b.time) > Date.now() && !(DEMO_MODE && demoBypass)) {
      showToast('노쇼는 예약 시간이 지난 뒤에 처리할 수 있어요.');
      return;
    }
    const deposit = b.deposit || PAYMENT_CONFIG.depositAmount;
    const fee = Math.round(deposit * SETTLEMENT_CONFIG.commissionRate);
    const total = noShowCount(b.userId) + 1;
    const ok = await askConfirm({
      title: '노쇼 처리',
      message: '노쇼로 처리하면 되돌릴 수 없어요. (고객은 이의 제기를 할 수 있어요)',
      details: [['예약금', `${deposit.toLocaleString()}원`], ['수수료(예시)', `-${fee.toLocaleString()}원`], ['원장님 정산', `${(deposit - fee).toLocaleString()}원`], ['고객 노쇼 누적', `${total}회${total >= NOSHOW_POLICY.blockAt ? ' (예약 제한)' : total >= NOSHOW_POLICY.warnAt ? ' (경고)' : ''}`]],
      confirmText: '노쇼 처리', danger: true
    });
    if (!ok) return;
    setBookings(prev => prev.map(x => x.id === b.id ? { ...x, status: 'noshow', noShowAt: Date.now() } : x));
    logBookingEvent(b, '노쇼 처리', `예약금 ${deposit.toLocaleString()}원 정산(수수료 ${fee.toLocaleString()}원) · 고객 노쇼 누적 ${total}회${demoBypass ? ' · 시연용 시간 전 처리' : ''}`, 'owner');

  const adminToggleShopInfo = async (shop) => {

  const adminHideReview = async (r, shopId) => {

    notify('shop:' + shopId, on ? '매장 후기 1건이 운영 정책에 따라 숨김 처리되었어요.' : '숨김 처리된 후기 1건이 다시 공개되었어요.');

  const adminToggleRestrict = async (acc) => {

    if (!reason) return;
    patchUserDataFor(acc.id, () => ({ points: after }));
    addPointLog(acc.id, 'point', `${after - before >= 0 ? '+' : ''}${after - before}P`, `관리자 조정: ${reason}`);
    logAdmin({ targetType: 'user', targetId: acc.id, targetName: acc.name, field: '포인트', before: `${before}P`, after: `${after}P`, reason });
    notify(acc.id, `포인트가 조정되었어요: ${before.toLocaleString()}P → ${after.toLocaleString()}P (사유: ${reason})`);
  };
  const adminToggleCoupon = async (acc, coupon) => {
    const reason = await askReason({ title: coupon.used ? '쿠폰 복구' : '쿠폰 사용 처리', message: coupon.name, confirmText: '변경' });
    if (!reason) return;
    patchUserDataFor(acc.id, (d) => ({ coupons: (d.coupons || INITIAL_COUPONS).map(c => (c.id === coupon.id ? { ...c, used: !coupon.used } : c)) }));

    notify(acc.id, `쿠폰 ‘${coupon.name}’ 상태가 ${coupon.used ? '사용가능으로 복구' : '사용완료로 변경'}되었어요. (사유: ${reason})`);

  const adminGrantCoupon = async (acc) => {

    patchAccount(acc.id, { noShowAdjust: (acc.noShowAdjust || 0) + (after - before) });
    logAdmin({ targetType: 'user', targetId: acc.id, targetName: acc.name, field: '노쇼 횟수', before: `${before}회`, after: `${after}회`, reason });
    notify(acc.id, `노쇼 누적 횟수가 ${before}회 → ${after}회로 정정되었어요. (사유: ${reason})`);
  };
  const BOOKING_STATUS_OPTIONS = [['confirmed', '방문확정'], ['completed', '시술완료'], ['noshow', '노쇼'], ['cancelled', '취소']];

    if (next === 'confirmed') {

      if (clash) { showToast(`같은 시간에 이미 확정된 예약(${clash.userName} 고객)이 있어 방문확정으로 정정할 수 없어요.`); return; }
    }

    } : x)));
    logAdmin({ targetType: 'booking', targetId: b.id, targetName: `${b.userName} 고객 예약 ${formatDateLabel(b.date)} ${b.time}`, field: '예약 상태', before: beforeLabel, after: afterLabel, reason });

    notify('shop:' + b.shopId, `예약 상태가 운영팀에 의해 정정되었어요: ${b.userName} 고객 ${formatDateLabel(b.date)} ${b.time} ${beforeLabel} → ${afterLabel}`);

  const historyShop = (h) => { const d = designs.find(x => x.id === h.designId); return shops.find(s => s.id === (h.shopId || (d && d.shopId))) || shops.find(s => s.name === h.shopName); };
