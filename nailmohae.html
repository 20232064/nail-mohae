// ───────────── 지도 / 지오코딩 ─────────────
// 지도: Leaflet(cdnjs) + OpenStreetMap 타일 — API 키 없이 GitHub Pages에서 바로 동작.
// 지오코딩: OSM Nominatim (무료, 초당 1회 제한). 한국 주소 정확도는 카카오/네이버보다 낮으므로
// 원장님이 지도에서 핀을 드래그해 위치를 보정할 수 있게 함.
// 상용화 시 카카오맵 JS SDK(services 라이브러리) 또는 백엔드 지오코딩으로 교체 권장.
const LEAFLET_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
let leafletPromise = null;

function loadLeaflet() {
  if (typeof window === 'undefined' || typeof document === 'undefined') return Promise.reject(new Error('no-dom'));
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (leafletPromise) return leafletPromise;
  leafletPromise = new Promise((resolve, reject) => {
    if (!document.getElementById('leaflet-css')) {
      const link = document.createElement('link');
      link.id = 'leaflet-css';
      link.rel = 'stylesheet';
      link.href = LEAFLET_BASE + 'leaflet.css';
      document.head.appendChild(link);
    }
    const script = document.createElement('script');
    script.src = LEAFLET_BASE + 'leaflet.js';
    script.async = true;
    const timer = setTimeout(() => fail(new Error('leaflet-timeout')), 10000);
    function fail(err) { clearTimeout(timer); leafletPromise = null; reject(err); }
    script.onload = () => {
      clearTimeout(timer);
      if (window.L && window.L.map) resolve(window.L); else fail(new Error('leaflet-missing'));
    };
    script.onerror = () => fail(new Error('leaflet-load-failed'));
    document.head.appendChild(script);
  });
  return leafletPromise;
}

// "(조례호수공원 5분)" 같은 안내 문구 제거
function normalizeAddress(address) {
  return (address || '').replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
}

// 지오코딩용: 맨 앞 시·도(전남/전라남도/광역시 등)는 뺀다.
// OSM은 행정구역 개편으로 시·도 명칭이 바뀌어(예: 전남광주통합특별시) "전라남도 …"로 검색하면 결과가 비는 문제가 있음.
// 시/군/구부터 검색해도 같은 이름의 동이 다른 시에 있는 경우는 시 이름으로 충분히 구분됨.
function geocodeQuery(address) {
  const tokens = normalizeAddress(address).split(' ').filter(Boolean);
  if (tokens.length > 2 && /^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)$|(도|특별시|광역시|특별자치시)$/.test(tokens[0])) {
    tokens.shift();
  }
  return tokens.join(' ');
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// 반환: { lat, lng, precise } | null  (precise=false면 동/읍 단위 등으로 범위를 넓혀 찾은 결과)
async function geocodeAddress(address) {
  const full = geocodeQuery(address);
  if (!full) return null;
  const tokens = full.split(' ');
  const candidates = [full];
  // 번지/건물번호로 못 찾으면 뒤에서부터 한 단어씩 빼서 재시도 (최대 3회, Nominatim 1초 제한 준수)
  for (let n = tokens.length - 1; n >= 2 && candidates.length < 3; n--) candidates.push(tokens.slice(0, n).join(' '));
  for (let i = 0; i < candidates.length; i++) {
    if (i > 0) await sleep(1100);
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q=' + encodeURIComponent(candidates[i]);
    const res = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('geocode-http-' + res.status);
    const data = await res.json();
    if (data && data.length) {
      return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), precise: i === 0 };
    }
  }
  return null;
}

// 실제 지도. Leaflet 로드 실패(오프라인·CDN 차단) 시 SVG 약도로 자동 대체.
function ShopMap({ lat, lng, label, height = 150, draggable = false, onMove }) {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const onMoveRef = useRef(onMove);
  onMoveRef.current = onMove;
  const [failed, setFailed] = useState(false);
  const hasCoords = Number.isFinite(lat) && Number.isFinite(lng);

  useEffect(() => {
    if (!hasCoords) return undefined;
    let cancelled = false;
    loadLeaflet().then((L) => {
      if (cancelled || !elRef.current) return;
      if (!mapRef.current) {
        const map = L.map(elRef.current, {
          zoomControl: draggable, scrollWheelZoom: false, attributionControl: true
        }).setView([lat, lng], 16);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>'
        }).addTo(map);
        const icon = L.divIcon({
          className: '',
          html: '<div style="font-size:28px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))">📍</div>',
          iconSize: [28, 28], iconAnchor: [14, 28]
        });
        const marker = L.marker([lat, lng], { icon, draggable, keyboard: draggable }).addTo(map);
        marker.on('dragend', () => {
          const p = marker.getLatLng();
          if (onMoveRef.current) onMoveRef.current({ lat: p.lat, lng: p.lng });
        });
        mapRef.current = map;
        markerRef.current = marker;
        // 모달 애니메이션 등으로 컨테이너 크기가 늦게 잡히는 경우 대비
        setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 200);
      } else {
        mapRef.current.setView([lat, lng], mapRef.current.getZoom());
        markerRef.current.setLatLng([lat, lng]);
      }
    }).catch(() => { if (!cancelled) setFailed(true); });
    return () => { cancelled = true; };
  }, [lat, lng, hasCoords, draggable]);

  // 언마운트 시 Leaflet 인스턴스 정리
  useEffect(() => () => {
    if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; markerRef.current = null; }
  }, []);

  if (!hasCoords || failed) return <MapPreview lat={hasCoords ? lat : 34.95} lng={hasCoords ? lng : 127.49} label={label} height={height} />;

  return (
    // isolation: Leaflet 내부 z-index(400~1000)가 하단 탭바·모달 위로 올라오지 않도록 격리
    <div style={{ position: 'relative', width: '100%', height: `${height}px`, isolation: 'isolate', background: '#eef3ec' }}>
      <div ref={elRef} role="img" aria-label={`${label} 위치 지도`} style={{ position: 'absolute', inset: 0 }} />
    </div>
  );
}

// SVG 약도 (지도 로드 실패 시 대체용)
function MapPreview({ lat, lng, label, height = 150 }) {
  // 좌표를 시드로 사용해 도로/구획을 살짝 다르게 배치 (매장마다 다른 느낌)

// ───────────── 브라우저 저장소 ─────────────
// ⚠️ 프로토타입용: 데이터가 "이 브라우저"에만 저장됨. 상용화 시 서버 DB(예: Supabase/Firebase/자체 API)로 교체.
const STORE_PREFIX = 'nailmohae.v1.';
const storage = {
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem(STORE_PREFIX + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { window.localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); return true; } catch (e) { return false; }
  },
  remove(key) {
    try { window.localStorage.removeItem(STORE_PREFIX + key); } catch (e) { /* noop */ }
  },
  clearAll() {
    try {
      Object.keys(window.localStorage).filter(k => k.startsWith(STORE_PREFIX)).forEach(k => window.localStorage.removeItem(k));
      window.sessionStorage.removeItem(STORE_PREFIX + 'session');
    } catch (e) { /* noop */ }
  }
};

// 저장 데이터 버전. 기본 샵/디자인 데이터가 바뀌면 올리고 migrateStorage 에 처리 추가.
const DATA_VERSION = 3;
// 예전 버전으로 저장된 브라우저 데이터에 새 기본 데이터(신규 업종 샵·상품, 승인 상태)를 합쳐 넣음. 사용자가 만든 데이터는 유지.
function migrateStorage() {
  const v = storage.get('dataVersion', 0);
  if (v >= DATA_VERSION) return;
  const savedShops = storage.get('shops', null);
  if (savedShops) {
    const ids = new Set(savedShops.map(s => s.id));
    const initialIds = new Set(INITIAL_SHOPS.map(s => s.id));
    const merged = savedShops
      .map(s => (initialIds.has(s.id) && !s.status ? { ...s, status: 'approved' } : s))
      .concat(INITIAL_SHOPS.filter(s => !ids.has(s.id)).map(s => ({ bizType: 'nail', status: 'approved', ...s })));
    storage.set('shops', merged);
  }
  const savedDesigns = storage.get('designs', null);
  if (savedDesigns) {
    const ids = new Set(savedDesigns.map(d => d.id));
    storage.set('designs', savedDesigns.concat(INITIAL_DESIGNS.filter(d => !ids.has(d.id))));
  }
  storage.set('dataVersion', DATA_VERSION);
}
function usePersistentState(key, initial) {
  const [value, setValue] = useState(() => storage.get(key, typeof initial === 'function' ? initial() : initial));
  useEffect(() => {
    // 저장 실패(용량 초과·저장소 차단) 시 앱에 알려서 사용자에게 안내
    if (!storage.set(key, value)) {
      try { window.dispatchEvent(new CustomEvent('nailmohae:storage-error', { detail: key })); } catch (e) { /* noop */ }
    }
  }, [key, value]);
  return [value, setValue];
}

const onlyDigits = (s) => String(s || '').replace(/\D/g, '');

function formatPhone(s) {
  const d = onlyDigits(s).slice(0, 11);
  if (d.length < 4) return d;
  if (d.length < 8) return `${d.slice(0, 3)}-${d.slice(3)}`;
  return `${d.slice(0, 3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}`;
}
const isValidPhone = (s) => /^01[016789]\d{7,8}$/.test(onlyDigits(s));
const isValidEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim());

function formatBizNo(s) {
  const d = onlyDigits(s).slice(0, 10);
  if (d.length <= 3) return d;
  if (d.length <= 5) return `${d.slice(0, 3)}-${d.slice(3)}`;
  return `${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5)}`;
}
// 사업자등록번호 체크섬(국세청 공개 알고리즘). 형식 검증일 뿐, 실제 영업 상태 확인은 백엔드에서 국세청 API로 해야 함.
function isValidBizNo(s) {
  const d = onlyDigits(s);
  if (d.length !== 10) return false;
  const w = [1, 3, 7, 1, 3, 7, 1, 3, 5];
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += Number(d[i]) * w[i];
  sum += Math.floor((Number(d[8]) * 5) / 10);
  return (10 - (sum % 10)) % 10 === Number(d[9]);
}
// 통신판매업 신고번호 예: 제2026-전남순천-0123호
const isValidMailOrderNo = (s) => /^제?\d{4}-[가-힣A-Za-z0-9]{2,15}-\d{3,6}호?$/.test(String(s || '').replace(/\s/g, ''));

function passwordIssue(pw) {
  if (!pw || pw.length < 8) return '비밀번호는 8자 이상이어야 해요.';
  if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return '영문과 숫자를 함께 사용해주세요.';
  return '';
}

const maskName = (name) => (name ? `${name.charAt(0)}**` : '회원');

const toHex = (buf) => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
function randomHex(bytes) {
  const a = new Uint8Array(bytes);
  window.crypto.getRandomValues(a);
  return toHex(a);
}
// 비밀번호는 평문 저장 금지 — PBKDF2(SHA-256, 10만 회)로 해시해서 저장
async function hashPassword(password, saltHex) {
  if (!(window.crypto && window.crypto.subtle)) throw new Error('no-webcrypto');
  const enc = new TextEncoder();
  const key = await window.crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const salt = new Uint8Array(saltHex.match(/../g).map(h => parseInt(h, 16)));
  const bits = await window.crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, key, 256);
  return toHex(bits);
}

const TIME_SLOTS = ['11:00', '13:00', '15:00', '17:00', '19:00'];
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
const pad2 = (n) => String(n).padStart(2, '0');
const toDateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const slotTime = (dateKey, time) => {
  const [y, m, d] = dateKey.split('-').map(Number);

  return new Date(y, m - 1, d, hh, mm).getTime();

  const dt = new Date(y, m - 1, d);
  return `${m}.${pad2(d)} (${WEEKDAYS[dt.getDay()]})`;
};

};

function upcomingDays(n = 7) {
  const out = [];
  const base = new Date();
  for (let i = 0; i < n; i++) {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    out.push({ key: toDateKey(d), weekday: d.getDay(), label: i === 0 ? '오늘' : i === 1 ? '내일' : `${d.getMonth() + 1}.${pad2(d.getDate())}`, sub: WEEKDAYS[d.getDay()] });
  }
  return out;
}

// 영업시간 문구에서 정기 휴무 요일 추출: "(월요일 휴무)" → [1]
function closedWeekdays(hours) {
  const m = String(hours || '').match(/([일월화수목금토])요일\s*휴무/g) || [];
  return m.map(x => WEEKDAYS.indexOf(x.charAt(0))).filter(i => i >= 0);
}

const CANCEL_FREE_HOURS = 24; // 방문 24시간 전까지 취소 시 예약금 전액 환불 (약관과 동일하게 유지)
const BOOKING_LEAD_MS = 30 * 60 * 1000; // 시작 30분 전부터는 예약 불가

// 중복 예약 방지 핵심 로직. 같은 샵·같은 디자이너·같은 시간대 확정 예약이 있으면 막고,
// 고객 본인이 같은 시간에 다른 예약을 갖고 있어도 막는다.
// ⚠️ 실서비스에서는 서버에서 트랜잭션/유니크 제약(shopId+designerId+date+time)으로 한 번 더 막아야 함.
function checkSlot(bookings, { shopId, designerId, date, time, userId, hours, staff: staffList }) {
  if (closedWeekdays(hours).includes(new Date(slotTime(date, '00:00')).getDay())) return { ok: false, reason: '휴무' };
  if (slotTime(date, time) - Date.now() < BOOKING_LEAD_MS) return { ok: false, reason: '마감' };
  const active = bookings.filter(b => b.status === 'confirmed' && b.date === date && b.time === time);
  if (userId && active.some(b => b.userId === userId)) return { ok: false, reason: '내 예약 있음' };
  const taken = active.filter(b => b.shopId === shopId).map(b => b.designerId);
  const staff = (staffList || SHOP_STAFF[shopId] || []).filter(s => s.active !== false);
  if (designerId) return taken.includes(designerId) ? { ok: false, reason: '예약 마감' } : { ok: true, designerId };
  const free = staff.find(s => !taken.includes(s.id));
  if (staff.length === 0) return taken.length ? { ok: false, reason: '예약 마감' } : { ok: true, designerId: null };
  return free ? { ok: true, designerId: free.id } : { ok: false, reason: '예약 마감' };
}

// ───────────── 검색 ─────────────
const squash = (s) => String(s || '').toLowerCase().replace(/\s+/g, '');
// 공백으로 나눈 모든 단어가 포함되어야 일치 ("조례 글리터" → 조례동 샵의 글리터 디자인)
function searchScore(fields, query) {
  const tokens = String(query || '').toLowerCase().split(/\s+/).filter(Boolean).map(squash);
  if (!tokens.length) return 0;
  const hay = fields.map(squash);
  let score = 0;
  for (const t of tokens) {
    const idx = hay.findIndex(h => h.includes(t));
    if (idx < 0) return 0;
    score += idx === 0 ? 3 : 1; // 첫 필드(제목/상호) 일치에 가중치
  }
  return score;
}

// ───────────── 이미지 최적화 ─────────────
// Unsplash 이미지는 표시 크기에 맞춰 w/h 파라미터를 줄여 요청 (600px 원본 → 썸네일은 160px 등)
function sizedSrc(url, px) {
  if (!url || !/images\.unsplash\.com/.test(url)) return url;
  const w = Math.min(1200, Math.round(px));
  return url.replace(/([?&])w=\d+/, `$1w=${w}`).replace(/([?&])h=\d+/, `$1h=${w}`);
}

// 업로드 사진을 최대 1080px JPEG로 줄여 저장 (용량 수 MB → 수백 KB)
function compressImage(file, maxSize = 1080, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        try {
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (e) { resolve(reader.result); }
      };
      img.onerror = () => resolve(reader.result);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
const MAX_UPLOAD_BYTES = 15 * 1024 * 1024;

// ⚠️ 실결제 시 반드시 백엔드에서 paymentId로 포트원 API를 조회해 금액·상태를 검증한 뒤 예약을 확정할 것 (프론트 결과만 믿으면 위변조 가능).
const PAYMENT_CONFIG = {
  mode: 'simulation',
  storeId: '',
  channelKey: '',
  depositAmount: 10000
};
const scriptPromises = {};
function loadScriptOnce(src) {
  if (scriptPromises[src]) return scriptPromises[src];
  scriptPromises[src] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => { delete scriptPromises[src]; reject(new Error('script-load-failed')); };
    document.head.appendChild(s);
  });
  return scriptPromises[src];
}
async function requestDepositPayment({ orderName, amount, customer }) {
  const live = PAYMENT_CONFIG.mode === 'portone' && PAYMENT_CONFIG.storeId && PAYMENT_CONFIG.channelKey;
  if (!live) {
    await sleep(500);
    return { ok: true, simulated: true, paymentId: 'sim_' + Date.now() };
  }
  try {
    await loadScriptOnce('https://cdn.portone.io/v2/browser-sdk.js');
    const paymentId = `nm_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    const res = await window.PortOne.requestPayment({
      storeId: PAYMENT_CONFIG.storeId,
      channelKey: PAYMENT_CONFIG.channelKey,
      paymentId,
      orderName,
      totalAmount: amount,
      currency: 'CURRENCY_KRW',
      payMethod: 'EASY_PAY',
      customer: { fullName: customer.name, phoneNumber: customer.phone }
    });
    if (!res || res.code) return { ok: false, message: (res && res.message) || '결제가 취소되었습니다.' };
    return { ok: true, paymentId };
  } catch (e) {
    return { ok: false, message: '결제창을 불러오지 못했어요. 잠시 후 다시 시도해주세요.' };
  }
}

// size: 화면에 표시되는 대략적인 가로 px. 2배 해상도까지 srcSet 으로 제공.
function Visual({ item, className, style, size = 240, eager = false }) {
  const [imgError, setImgError] = useState(false);
  const label = item.title || item.name || '네일 디자인';
  if (imgError || !item.img) {
    return (
      <span role="img" aria-label={label} className={className} style={{ display: 'block', overflow: 'hidden', ...style }}>
        <NailSwatch colorA={item.colorA} colorB={item.colorB} pattern={item.pattern || 'plain'} className="w-full h-full" />
      </span>
    );
  }
  const isRemote = /^https?:/.test(item.img);
  return (
    <img
      src={isRemote ? sizedSrc(item.img, size) : item.img}
      srcSet={isRemote ? `${sizedSrc(item.img, size)} 1x, ${sizedSrc(item.img, size * 2)} 2x` : undefined}
      alt={label}
      loading={eager ? 'eager' : 'lazy'}
      decoding="async"
      className={className}
      style={{ objectFit: 'cover', ...style }}
      onError={() => setImgError(true)}
    />
  );
}

  const handleLogin = async (e) => {

      const min = Math.ceil((fail.until - Date.now()) / 60000);
      setLoginError(`로그인 시도가 많아 잠시 잠겼어요. ${min}분 후 다시 시도해주세요.`);
      return;

    const refundable = hoursLeft >= CANCEL_FREE_HOURS;
    const msg = refundable
      ? '예약을 취소할까요? 방문 24시간 전이라 예약금 10,000원이 전액 환불돼요.'
      : '방문 24시간 이내라 예약금은 환불되지 않아요. 그래도 취소할까요?';
    if (!confirm(msg)) return;
    setBookings(prev => prev.map(x => x.id === b.id ? { ...x, status: 'cancelled', cancelledAt: Date.now(), refunded: refundable } : x));
    // 예약 때 쓴 쿠폰은 되돌려 주고, 예약 적립 포인트는 회수 (0P 아래로는 내려가지 않음)
    const restored = [];
    if (b.couponId && myCoupons.some(c => c.id === b.couponId && c.used)) {
      setMyCoupons(myCoupons.map(c => c.id === b.couponId ? { ...c, used: false } : c));
      restored.push('쿠폰 복구');
    }
    if (b.pointsEarned) {
      setMyPoints(Math.max(0, myPoints - b.pointsEarned));
      restored.push(`적립 ${b.pointsEarned}P 회수`);
    }
    const d = designs.find(x => x.id === b.designId);
    const when = `${formatDateLabel(b.date)} ${b.time}`;
    notify(uid, `예약이 취소되었어요: ${when}${refundable ? ' · 예약금 환불 예정' : ''}${restored.length ? ' · ' + restored.join(', ') : ''}`);
    if (restored.length) showToast(`예약 취소 완료 · ${restored.join(', ')}`);
    notify('shop:' + b.shopId, `❌ 예약 취소: ${b.userName} 고객 · ${d ? d.title : ''} · ${when}`);
  };

  const completeBooking = (b) => {
    setBookings(prev => prev.map(x => x.id === b.id ? { ...x, status: 'completed', completedAt: Date.now() } : x));
    notify(b.userId, '💅 시술이 완료되었어요! 후기를 남기면 300P를 드려요.');
  };

  const markNoShow = (b) => {
    if (!confirm('노쇼로 처리할까요? 예약금이 매장에 정산됩니다.')) return;
    setBookings(prev => prev.map(x => x.id === b.id ? { ...x, status: 'noshow', noShowAt: Date.now() } : x));
    const total = noShowCount(b.userId) + 1;
    notify(b.userId, `방문하지 않은 예약이 노쇼로 처리되었어요: ${formatDateLabel(b.date)} ${b.time} (누적 ${total}회${total >= NOSHOW_POLICY.blockAt ? ' · 예약 제한' : total >= NOSHOW_POLICY.warnAt ? ` · ${NOSHOW_POLICY.blockAt}회 시 예약 제한` : ''})`);
  };

  // ── 관리자: 입점 심사 ──
  const approveShop = (shop) => {
    setShops(prev => prev.map(s => s.id === shop.id ? { ...s, status: 'approved', reviewedAt: Date.now(), rejectReason: '' } : s));
    notify('shop:' + shop.id, '🎉 입점 심사가 승인되었어요! 이제 고객 화면에 매장이 노출됩니다.');
    showToast(`${shop.name} 승인 완료`);
  };
  const rejectShop = (shop) => {
    const reason = (rejectDrafts[shop.id] || '').trim();
    if (!reason) { showToast('반려 사유를 입력해주세요.'); return; }
    setShops(prev => prev.map(s => s.id === shop.id ? { ...s, status: 'rejected', reviewedAt: Date.now(), rejectReason: reason } : s));
    notify('shop:' + shop.id, `입점 심사가 반려되었어요. 사유: ${reason}`);
    setRejectDrafts({ ...rejectDrafts, [shop.id]: '' });
    showToast(`${shop.name} 반려 처리`);
  };
  const requestReReview = () => {
    setShops(prev => prev.map(s => s.id === myShopId ? { ...s, status: 'pending', appliedAt: Date.now() } : s));
    notify('admin', `🔁 재심사 요청: ${myShop.name}`);
    showToast('재심사를 요청했어요.');
  };

  // ── 후기 신고 / 수정 / 삭제 ──
  const findReview = (reviewId) => {
    for (const [shopId, list] of Object.entries(shopReviews)) {
      const r = (list || []).find(x => x.id === reviewId);
      if (r) return { shopId, review: r };
    }
    return null;
  };
  const updateReview = (reviewId, patch) => {
    setShopReviews(prev => {
      const next = {};
      for (const [shopId, list] of Object.entries(prev)) next[shopId] = (list || []).map(r => r.id === reviewId ? { ...r, ...patch } : r);
      return next;
    });
  };
  const resolveReport = (report, action) => {
    // action: 'hide' = 후기 숨김, 'keep' = 유지(신고 기각)
    if (action === 'hide') updateReview(report.reviewId, { hidden: true, hiddenAt: Date.now() });
    setReports(prev => prev.map(x => x.reviewId === report.reviewId && x.status === 'open' ? { ...x, status: action === 'hide' ? 'hidden' : 'kept', resolvedAt: Date.now() } : x));
    if (action === 'hide') notify('shop:' + report.shopId, '신고된 후기 1건이 운영 정책에 따라 숨김 처리되었어요.');
    showToast(action === 'hide' ? '후기를 숨김 처리했어요.' : '후기를 유지했어요.');
  };
  const [reportTarget, setReportTarget] = useState(null); // { review, shopId }
  const [reportReason, setReportReason] = useState('');
  const [editingReview, setEditingReview] = useState(null); // { id, rating, text }

  const canEditReview = (r) => r.authorId === uid && r.createdAt && Date.now() - r.createdAt <= REVIEW_EDIT_DAYS * 86400000;
  const alreadyReported = (reviewId) => reports.some(x => x.reviewId === reviewId && x.reporterId === uid);

  const openReport = (review, shopId) => {
    if (review.authorId === uid) return;
    if (alreadyReported(review.id)) { showToast('이미 신고한 후기예요. 운영팀이 확인 중이에요.'); return; }
    setReportReason('');
    setReportTarget({ review, shopId });
  };
  const submitReport = () => {
    if (!reportTarget) return;
    if (!reportReason) { showToast('신고 사유를 선택해주세요.'); return; }
    setReports(prev => [...prev, { id: 'rp_' + Date.now(), reviewId: reportTarget.review.id, shopId: reportTarget.shopId, reason: reportReason, reporterId: uid, at: Date.now(), status: 'open' }]);
    notify('admin', `🚩 후기 신고 (${reportReason}): "${reportTarget.review.comment.slice(0, 24)}"`);
    setReportTarget(null);
    showToast('신고가 접수되었어요. 운영팀이 확인 후 처리합니다.');
  };

  const saveReviewEdit = () => {
    if (!editingReview) return;
    const found = findReview(editingReview.id);
    if (!found || !canEditReview(found.review)) { showToast(`작성 후 ${REVIEW_EDIT_DAYS}일이 지나 수정할 수 없어요.`); setEditingReview(null); return; }
    if (!editingReview.rating) { showToast('별점을 선택해주세요.'); return; }
    const comment = editingReview.text.trim() || '(작성한 후기 없음)';
    updateReview(editingReview.id, { rating: editingReview.rating, comment, editedAt: Date.now() });
    setMyHistory(myHistory.map(h => h.reviewId === editingReview.id ? { ...h, myRating: editingReview.rating, myReview: comment } : h));
    setEditingReview(null);
    showToast('후기를 수정했어요.');
  };
  const deleteReview = (r) => {
    if (r.authorId !== uid) return;
    const reclaim = r.pointsGranted || 0;
    if (!confirm(`이 후기를 삭제할까요? 삭제한 후기는 되돌릴 수 없어요.${reclaim ? `\n후기 작성으로 받은 ${reclaim}P도 회수돼요.` : ''}`)) return;
    if (reclaim) setMyPoints(Math.max(0, myPoints - reclaim));
    setShopReviews(prev => {
      const next = {};
      for (const [shopId, list] of Object.entries(prev)) next[shopId] = (list || []).filter(x => x.id !== r.id);
      return next;
    });
    setMyHistory(myHistory.map(h => h.reviewId === r.id ? { ...h, myRating: 0, myReview: '(삭제한 후기)', reviewId: null } : h));
    if (editingReview && editingReview.id === r.id) setEditingReview(null);
    showToast(reclaim ? `후기를 삭제했어요. (${reclaim}P 회수)` : '후기를 삭제했어요.');
  };

  // 본인 후기: 수정(7일 이내)·삭제 / 타인 후기: 신고 — 샵 상세와 MY 후기 히스토리에서 공용으로 사용
  const renderReviewActions = (r, shopId) => {
    if (r.authorId === uid) {
      if (editingReview && editingReview.id === r.id) {
        return (
          <div className="mt-2 space-y-2">
            <div className="flex gap-1" role="radiogroup" aria-label="별점 수정">
              {[1, 2, 3, 4, 5].map(n => (
                <button key={n} role="radio" aria-checked={editingReview.rating === n} aria-label={`${n}점`} onClick={() => setEditingReview({ ...editingReview, rating: n })} className="text-xl leading-none">{n <= editingReview.rating ? '⭐' : '☆'}</button>
              ))}
            </div>
            <textarea aria-label="후기 수정" value={editingReview.text} maxLength={500} rows={2} onChange={(e) => setEditingReview({ ...editingReview, text: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none resize-none" />
            <div className="flex gap-2">
              <button onClick={() => setEditingReview(null)} className="flex-1 text-xs font-bold py-2 rounded-lg border border-slate-200 text-slate-600">취소</button>
              <button onClick={saveReviewEdit} className="flex-1 text-xs font-bold py-2 rounded-lg text-white" style={{ background: PINK }}>수정 저장</button>
            </div>
          </div>
        );
      }
      return (
        <div className="mt-2 flex gap-3 text-xs font-bold text-slate-600">
          {canEditReview(r)
            ? <button onClick={() => setEditingReview({ id: r.id, rating: r.rating, text: r.comment === '(작성한 후기 없음)' ? '' : r.comment })} className="underline">수정</button>
            : <span className="text-slate-500 font-semibold">수정 기간({REVIEW_EDIT_DAYS}일) 지남</span>}
          <button onClick={() => deleteReview(r)} className="underline">삭제</button>
          {r.hidden && <span className="text-rose-700">운영 정책에 따라 숨김 처리됨</span>}
        </div>
      );
    }
    return (
      <div className="mt-1.5 text-right">
        <button onClick={() => openReport(r, shopId)} className="text-xs font-semibold text-slate-500 underline" aria-label={`${r.author} 후기 신고`}>
          {alreadyReported(r.id) ? '신고 접수됨' : '신고'}
        </button>
      </div>
    );
  };

  const unhideReview = (reviewId) => {
    updateReview(reviewId, { hidden: false });
    showToast('숨김을 해제했어요.');
  };

  // ── 샵 평점·리뷰 수 ──
  // 기존 가상 샵의 rating/reviews 는 '앱 출시 전 누적값(기준값)'으로 보고, 앱에서 작성된 후기(createdAt 있음)를 더해 계산.
  // 숨김 처리된 후기는 빼고, 후기가 하나도 없으면 rating=null → '신규'로 표시.
  const shopStats = (s) => {
    const list = shopReviews[s.id] || [];
    const added = list.filter(r => r.createdAt && !r.hidden);
    const hiddenSeed = list.filter(r => !r.createdAt && r.hidden);
    const baseCount = Math.max(0, (s.reviews || 0) - hiddenSeed.length);
    const baseSum = Math.max(0, (s.rating || 0) * (s.reviews || 0) - hiddenSeed.reduce((a, r) => a + r.rating, 0));
    const count = baseCount + added.length;
    if (!count) return { rating: null, count: 0 };
    return { rating: Math.round(((baseSum + added.reduce((a, r) => a + r.rating, 0)) / count) * 10) / 10, count };
  };
  const ratingText = (s) => { const st = shopStats(s); return st.rating == null ? '신규 매장' : `⭐ ${st.rating.toFixed(1)} (${st.count})`; };

  // ── 노쇼 누적 ──
  const noShowCount = (userId) => bookings.filter(b => b.userId === userId && b.status === 'noshow').length;

  // ── 정산 (예시 계산) ──
  // 원장님 홈 카드와 관리자 정산 현황이 같은 계산을 쓰도록 하나로 둠. 기준: 이번 달(1일 0시~) 완료·노쇼 처리분.
  const monthStart = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1).getTime(); })();
  const shopSettlement = (s) => {
    const done = bookings.filter(b => b.shopId === s.id && b.status === 'completed' && (b.completedAt || 0) >= monthStart);
    const sales = done.reduce((sum, b) => {
      const d = designs.find(x => x.id === b.designId);
      return sum + (b.finalPrice != null ? b.finalPrice : (d ? d.price : 0));
    }, 0);
    const commission = Math.round(sales * SETTLEMENT_CONFIG.commissionRate);
    const noShowDeposit = bookings
      .filter(b => b.shopId === s.id && b.status === 'noshow' && (b.noShowAt || slotTime(b.date, b.time)) >= monthStart)
      .reduce((sum, b) => sum + (b.deposit || 0), 0);
    return { shop: s, count: done.length, sales, commission, payout: sales - commission, noShowDeposit };
  };
  const settlementRows = () => shops.filter(s => shopStatus(s) === 'approved').map(shopSettlement);

  // 다가오는 예약 알림: 24시간 이내 예약이 있으면 한 번 알림
  useEffect(() => {
    if (!currentUser) return;
    const now = Date.now();
    const due = bookings.filter(b => b.userId === uid && b.status === 'confirmed' && !b.reminded && slotTime(b.date, b.time) - now <= 24 * 3600000 && slotTime(b.date, b.time) > now);
    if (!due.length) return;
    due.forEach(b => {
      const s = shops.find(x => x.id === b.shopId);
      notify(uid, `⏰ 예약 알림: ${formatDateLabel(b.date)} ${b.time} ${s ? s.name : ''} 방문 예정이에요.`);
    });
    setBookings(prev => prev.map(b => due.some(x => x.id === b.id) ? { ...b, reminded: true } : b));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [uid, bookings]);

  // 저장 실패 안내 (사진을 많이 올려 브라우저 저장 공간이 꽉 찬 경우 등). 같은 안내는 10초에 한 번만.
  useEffect(() => {
    let last = 0;
    const onErr = () => {
      if (Date.now() - last < 10000) return;
      last = Date.now();
      showToast('⚠️ 저장 공간이 부족해 일부 내용이 저장되지 않았어요. 사진을 줄이거나 지운 뒤 다시 시도해주세요.');
    };
    window.addEventListener('nailmohae:storage-error', onErr);
    return () => window.removeEventListener('nailmohae:storage-error', onErr);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // 데스크톱: 마우스 휠(세로)로 가로 스크롤 줄(.hscroll)을 넘길 수 있게 함.
  // 끝까지 스크롤된 방향이면 페이지 세로 스크롤을 그대로 둠.
  useEffect(() => {
    let lastSnap = 0;
    const onWheel = (e) => {
      const el = e.target && e.target.closest && e.target.closest('.hscroll');
      if (!el || Math.abs(e.deltaY) <= Math.abs(e.deltaX) || el.scrollWidth <= el.clientWidth) return;
      const max = el.scrollWidth - el.clientWidth;
      if ((e.deltaY < 0 && el.scrollLeft <= 0) || (e.deltaY > 0 && el.scrollLeft >= max - 1)) return;
      e.preventDefault();
      if (el.dataset.snap === 'page') {
        const now = Date.now();
        if (now - lastSnap < 450) return;
        lastSnap = now;
        el.scrollBy({ left: Math.sign(e.deltaY) * el.clientWidth, behavior: 'smooth' });
      } else {
        el.scrollLeft += e.deltaY;
      }
    };
    window.addEventListener('wheel', onWheel, { passive: false });
    return () => window.removeEventListener('wheel', onWheel);
  }, []);

  // Esc 로 맨 위 모달 닫기 (키보드 접근성)
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (reportTarget) setReportTarget(null);
      else if (showTermsModal) setShowTermsModal(false);
      else if (showPrivacyModal) setShowPrivacyModal(false);
      else if (showMarketingModal) setShowMarketingModal(false);
      else if (showNotifications) setShowNotifications(false);
      else if (selectedHistoryId) setSelectedHistoryId(null);
      else if (selectedDesign) { setSelectedDesign(null); resetBookingFlow(); }
      else if (selectedShop) setSelectedShop(null);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  const submitReview = (booking) => {
    const draft = reviewDrafts[booking.id] || { rating: 0, text: '' };
    if (!draft.rating) {
      showToast('별점을 선택해주세요!');
      return;
    }
    const design = designs.find(d => d.id === booking.designId);
    const shop = shops.find(s => s.id === booking.shopId);
    const dateStr = todayDots();
    const comment = draft.text.trim() || '(작성한 후기 없음)';
    const newReview = { id: 'r_' + Date.now(), author: maskName(currentUser.name), authorId: uid, createdAt: Date.now(), rating: draft.rating, date: dateStr, comment, bookingId: booking.id, pointsGranted: 300 };
    setShopReviews({
      ...shopReviews,
      [booking.shopId]: [newReview, ...(shopReviews[booking.shopId] || [])]
    });
    setMyHistory([{
      id: 'h_' + Date.now(),
      designId: booking.designId,
      shopName: shop ? shop.name : (design ? design.shopName : ''),
      date: dateStr,
      myRating: draft.rating,
      myReview: comment,
      reviewId: newReview.id
    }, ...myHistory]);
    setBookings(prev => prev.map(b => b.id === booking.id ? { ...b, reviewed: true } : b));
    notify('shop:' + booking.shopId, `⭐ 새 리뷰 ${draft.rating}점: "${comment.slice(0, 30)}"`);
    setMyPoints(myPoints + 300);
    showToast('🎉 후기 감사합니다! 300P가 적립되었어요.');
  };

  const appliedCoupon = myCoupons.find(c => c.id === appliedCouponId && !c.used);
  const getDiscountedPrice = (price) => {
    if (!appliedCoupon) return price;
    if (appliedCoupon.type === 'percent') return Math.round(price * (1 - appliedCoupon.value / 100));
    return Math.max(0, price - appliedCoupon.value);
  };

  const toggleLike = (e, id) => {
    e.stopPropagation();
    setLikedIds(likedIds.includes(id) ? likedIds.filter(x => x !== id) : [...likedIds, id]);
  };

  const openShopFromDesign = (design) => {
    const shop = shops.find(s => s.id === design.shopId);
    if (shop) {
      setSelectedDesign(null);
      setBookingStep(0);
      setSelectedShop(shop);
    }
  };

  const myDesigns = designs.filter(d => d.shopId === myShopId);

  const chargeCredit = (amount) => {
    setCredit(credit + amount);
    alert(`💳 크레딧 ${amount.toLocaleString()}원이 충전되었습니다. 현재 잔액: ${(credit + amount).toLocaleString()}P`);
  };

  const registerBank = (e) => {
    e.preventDefault();
    if (!bankForm.bank || !bankForm.account || !bankForm.holder) {
      alert('은행명, 계좌번호, 예금주를 모두 입력해주세요.');
      return;
    }
    setBankInfo({ ...bankForm });
    setShowBankForm(false);
    alert('✅ 정산 계좌가 등록되었습니다. 고객 결제 대금이 이 계좌로 정산됩니다.');
  };

  const toggleDesignVisibility = (id) => {
    setHiddenDesignIds(hiddenDesignIds.includes(id) ? hiddenDesignIds.filter(x => x !== id) : [...hiddenDesignIds, id]);
  };

  const deleteMyDesign = (id) => {
    if (!confirm('이 디자인을 삭제하시겠습니까?')) return;
    setDesigns(designs.filter(d => d.id !== id));
  };

  const AD_COST = { '검색 상단 고정': 3000, '홈 배너 노출': 5000, '카테고리 상단 고정': 2000 };

  const saveProfile = async (e) => {
    e.preventDefault();
    if (!profileForm.name || !profileForm.location) {
      alert('샵 이름과 주소는 필수 입력 항목입니다.');
      return;
    }
    if (geo.status === 'loading') return;
    let next = profileForm;
    let warn = '';
    if (geoStale) {
      // 주소가 바뀌었는데 위치를 아직 안 찾았으면 저장 전에 자동으로 찾기
      const r = await findLocation(profileForm);
      if (r) next = { ...profileForm, lat: r.lat, lng: r.lng };
      else warn = '\n⚠️ 새 주소의 위치를 찾지 못해 지도 핀은 이전 위치로 유지됩니다.';
    }

  const startEditAd = (ad) => {

  const deleteAd = (id) => {
    const ad = ads.find(a => a.id === id);
    if (!confirm('이 광고를 삭제하시겠습니까? 남은 크레딧은 환불되지 않습니다.')) return;
    setAds(ads.filter(a => a.id !== id));
    if (editingAdId === id) cancelAdForm();
  };

  const submitAd = (e) => {
    e.preventDefault();
    if (!adForm.designId) return alert('광고할 디자인을 선택해주세요.');
    const newCost = AD_COST[adForm.type] * adForm.days;

    if (editingAdId) {
      const existing = ads.find(a => a.id === editingAdId);
      const diff = newCost - (existing ? existing.cost : 0);
      if (diff > 0 && diff > credit) {
        return alert(`크레딧이 부족합니다. 추가로 필요한 크레딧: ${diff.toLocaleString()}P (보유: ${credit.toLocaleString()}P)`);
      }
      setCredit(credit - diff);
      setAds(ads.map(a => a.id === editingAdId ? { ...a, designId: adForm.designId, type: adForm.type, days: adForm.days, keyword: adForm.keyword, cost: newCost } : a));
      alert(diff === 0 ? '✏️ 광고 정보가 수정되었습니다.' : `✏️ 광고가 수정되었습니다. ${diff > 0 ? diff.toLocaleString() + 'P가 추가 차감' : Math.abs(diff).toLocaleString() + 'P가 환불'}되었습니다.`);
    } else {
      if (newCost > credit) return alert(`크레딧이 부족합니다. 필요 크레딧: ${newCost.toLocaleString()}P (보유: ${credit.toLocaleString()}P)`);

      setAds([{ id: 'ad_' + Date.now(), designId: adForm.designId, type: adForm.type, days: adForm.days, keyword: adForm.keyword, cost: newCost, status: '진행중' }, ...ads]);

    if (file.size > MAX_UPLOAD_BYTES) { showToast('15MB 이하 사진만 올릴 수 있어요.'); return null; }
    try { return await compressImage(file); } catch (err) { showToast('사진을 읽지 못했어요.'); return null; }

              <div className="absolute inset-0 flex items-end justify-center z-50" style={{ backgroundColor: 'rgba(0,0,0,0.6)' }}>
                <div role="dialog" aria-modal="true" aria-label="시술 일기" className="bg-white w-full flex flex-col shadow-2xl" style={{ height: '92%', borderTopLeftRadius: '28px', borderTopRightRadius: '28px', overflow: 'hidden' }}>
                  <div className="px-5 pt-4 pb-3 border-b border-slate-100 flex justify-between items-center shrink-0">
                    <div>
                      <h3 className="text-base font-black text-slate-900">{d ? d.title : '삭제된 디자인'}</h3>
                      <p className="text-xs text-slate-500">{h.shopName} · {h.date}</p>
                    </div>
                    <button onClick={() => setSelectedHistoryId(null)} aria-label="닫기" className="w-9 h-9 bg-slate-100 rounded-full flex items-center justify-center shrink-0">
                      <X className="w-4 h-4 text-slate-600" />
                    </button>
                  </div>
                  <div className="p-5 flex-1 overflow-y-auto space-y-4">
                    <div>
                      <p className="text-xs font-bold text-slate-500 mb-2">사진 비교</p>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <p className="text-xs text-center text-slate-500 mb-1">샵 디자인 사진</p>
                          {d && <Visual item={d} className="w-full rounded-xl" style={{ aspectRatio: '1 / 1' }} />}
                        </div>
                        <div>
                          <p className="text-xs text-center text-slate-500 mb-1">내가 찍은 사진</p>
                          <div className="w-full rounded-xl bg-slate-100 border border-dashed border-slate-300 flex items-center justify-center overflow-hidden" style={{ aspectRatio: '1 / 1' }}>
                            {h.myPhoto ? (
                              <img src={h.myPhoto} alt="내 시술 사진" className="w-full h-full object-cover" />
                            ) : (
                              <span className="text-xs text-slate-600 text-center px-2">아직 사진이 없어요</span>
                            )}
                          </div>
                        </div>
                      </div>
                      <label className="mt-2 block text-center text-xs font-bold text-white rounded-xl py-2.5 cursor-pointer" style={{ background: PINK }}>
                        {h.myPhoto ? '사진 다시 찍기 / 바꾸기' : '📷 내 사진 추가하기'}
                        <input type="file" accept="image/*" capture="environment" onChange={(e) => handleHistoryPhotoSelect(e, h.id)} className="hidden" />
                      </label>
                    </div>

                    <div>
                      <p className="text-xs font-bold text-slate-500 mb-2">✍️ 나만의 시술 일기</p>
                      <textarea
                        value={diaryDraft}
                        onChange={(e) => setDiaryDraft(e.target.value)}
                        placeholder="이날 어떤 기분이었는지, 관리는 어떻게 했는지 자유롭게 적어보세요 :)"
                        rows={6}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-800 placeholder-slate-500 focus:outline-none resize-none"
                      />
                      <button
                        onClick={() => saveDiary(h.id)}
                        className="w-full mt-2 text-white text-sm font-bold py-2.5 rounded-xl"
                        style={{ background: '#0f172a' }}
                      >
                        일기 저장하기
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

        </div>
        </>
        )}

        {showNotifications && isLoggedIn && (
          <Sheet title={appMode === 'B2B' ? '매장 알림' : '알림'} onClose={() => setShowNotifications(false)} height="70%">
            <div className="flex-1 overflow-y-auto p-3 space-y-2">
              {myNotifications.length === 0 ? (
                <p className="text-sm text-slate-500 text-center py-12">새 알림이 없어요.</p>
              ) : myNotifications.map((n) => (
                <div key={n.id} className="p-3 rounded-xl border border-slate-100 bg-slate-50">
                  <p className="text-sm text-slate-800 leading-relaxed">{n.text}</p>
                  <p className="text-xs text-slate-500 mt-1">{new Date(n.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
                </div>
              ))}
              <p className="text-xs text-slate-500 text-center pt-2 leading-relaxed">앱 안의 알림만 제공돼요. 문자·카카오 알림톡 발송은 서버 연동 후 지원 예정이에요.</p>
            </div>
          </Sheet>
        )}
        {showTermsModal && (
          <Sheet title="이용약관" onClose={() => setShowTermsModal(false)}>
            <div className="p-4 overflow-y-auto text-xs text-slate-600 leading-relaxed whitespace-pre-wrap">{TERMS_TEXT}</div>
          </Sheet>
        )}
        {showPrivacyModal && (
          <Sheet title="개인정보처리방침" onClose={() => setShowPrivacyModal(false)}>
            <div className="p-4 overflow-y-auto text-xs text-slate-600 leading-relaxed whitespace-pre-wrap">{PRIVACY_TEXT}</div>
          </Sheet>
        )}
        {showMarketingModal && (
          <Sheet title="마케팅 정보 수신 동의" onClose={() => setShowMarketingModal(false)} height="50%">
            <div className="p-4 overflow-y-auto text-xs text-slate-600 leading-relaxed whitespace-pre-wrap">{MARKETING_TEXT}</div>
          </Sheet>
        )}
        {reportTarget && (
          <Sheet title="후기 신고" onClose={() => setReportTarget(null)} height="62%">
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              <div className="bg-slate-50 rounded-xl p-3 text-sm text-slate-700">
                <p className="text-xs text-slate-500 mb-1">{reportTarget.review.author} · {reportTarget.review.date}</p>
                {reportTarget.review.comment}
              </div>
              <fieldset className="space-y-1.5">
                <legend className="text-xs font-bold text-slate-600 mb-1">신고 사유를 선택해주세요</legend>
                {REPORT_REASONS.map(reason => (
                  <label key={reason} className="flex items-center gap-2 text-sm text-slate-700 p-2.5 rounded-xl border border-slate-200 cursor-pointer" style={reportReason === reason ? { borderColor: PINK, background: '#FFF0F4' } : {}}>
                    <input type="radio" name="report-reason" value={reason} checked={reportReason === reason} onChange={() => setReportReason(reason)} className="w-4 h-4" />
                    {reason}
                  </label>
                ))}
              </fieldset>
              {/* [검토 필요] 게시중단(임시조치) 요청 절차 — 정보통신망법 제44조의2 대응 방식 확정 후 안내 문구 보완 */}
              <p className="text-xs text-slate-500 leading-relaxed">신고된 후기는 운영팀이 확인 후 숨김 또는 유지로 처리해요. 허위 신고가 반복되면 이용이 제한될 수 있어요.</p>
              <button onClick={submitReport} className="w-full text-white text-sm font-bold py-3 rounded-xl" style={{ background: '#0f172a' }}>신고하기</button>
            </div>
          </Sheet>
        )}
        {toast && (
          <div role="status" aria-live="polite" className="absolute left-4 right-4 bottom-20 z-[60] bg-slate-900 text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-lg text-center">
            {toast}
          </div>
        )}
      </div>
    </div>
  );
}
</script>

<script>
  (function () {
    try {
      var source = document.getElementById('app-source').textContent;
      var output = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]]
      }).code;
      output += '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));';
      var script = document.createElement('script');
      script.textContent = output;
      document.body.appendChild(script);
    } catch (e) {
      document.getElementById('root').innerHTML = '<p style="padding:24px;font-size:14px">앱을 불러오지 못했어요. 새로고침해 주세요.</p>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
