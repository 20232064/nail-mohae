  // ── MY: 알림 설정·고객센터·공지·FAQ·탈퇴 ──
  const [mySheet, setMySheet] = useState(null); // 'notif' | 'support' | 'notices' | 'faq' | 'withdraw'
  const [openNoticeId, setOpenNoticeId] = useState(null);
  const [inquiryForm, setInquiryForm] = useState({ type: '예약', content: '' });
  const [withdrawChoice, setWithdrawChoice] = useState('anonymize');
  const [withdrawAgree, setWithdrawAgree] = useState(false);
  const notifPrefs = ud.notifPrefs || {};
  const setReviewNotif = (on) => { patchUserData({ notifPrefs: { ...notifPrefs, review: on } }); showToast(on ? '후기 작성 알림을 켰어요.' : '후기 작성 알림을 껐어요.'); };
  const [inquiries, setInquiries] = usePersistentState('inquiries', []);
  const [notices, setNotices] = usePersistentState('notices', DEFAULT_NOTICES);
  const policyNoticeBody = () => `· 예약금 ${PAYMENT_CONFIG.depositAmount.toLocaleString()}원은 시술 당일 시술 대금에서 차감돼요.\n· 방문 ${CANCEL_FREE_HOURS}시간 전까지 취소하면 예약금 전액 환불, 이후 취소·노쇼는 환불되지 않아요.\n· 매장 사정·천재지변으로 취소되면 예약금 전액 환불과 쿠폰·포인트를 돌려드려요.\n· 노쇼 ${NOSHOW_POLICY.warnAt}회 이상이면 경고, ${NOSHOW_POLICY.blockAt}회 이상이면 예약이 제한돼요.\n· 예약 변경은 방문 ${RESCHEDULE_POLICY.minHoursBefore}시간 전까지 ${RESCHEDULE_POLICY.maxCount}회 가능해요.`;
  const noticeBody = (nt) => (nt.policy ? policyNoticeBody() : nt.body);
  // 자주 묻는 질문: 환불·노쇼 등 수치는 상세 화면 안내와 같은 설정값 사용
  const faqList = () => [
    ['예약', '예약은 어떻게 하나요?', `디자인을 고르고 [지금 바로 예약하기]에서 디자이너·날짜·시간을 정한 뒤 예약금 ${PAYMENT_CONFIG.depositAmount.toLocaleString()}원을 결제하면 예약이 확정돼요. 옵션을 고르면 금액과 소요 시간이 함께 늘어나요.`],
    ['예약', '예약 날짜·시간을 바꿀 수 있나요?', `방문 ${RESCHEDULE_POLICY.minHoursBefore}시간 전까지 예약당 ${RESCHEDULE_POLICY.maxCount}회 바꿀 수 있어요. 스케줄 → [예약 변경]에서 날짜·시간만 바꿀 수 있고, 디자인·옵션은 취소 후 다시 예약해주세요.`],
    ['취소', '예약을 취소하려면요?', '스케줄 → 예약 카드의 [예약 취소]를 누르세요. 취소하면 사용한 쿠폰은 돌려드리고 예약 적립 포인트는 회수돼요.'],
    ['환불', '취소하면 예약금이 환불되나요?', `방문 ${CANCEL_FREE_HOURS}시간 전까지 취소하면 전액 환불돼요. ${CANCEL_FREE_HOURS}시간 이내 취소·노쇼는 환불되지 않아요. 매장 사정이나 천재지변으로 취소되면 전액 환불돼요.`],
    ['노쇼', '노쇼하면 어떻게 되나요?', `예약금은 환불되지 않고 매장에 정산돼요. 노쇼가 ${NOSHOW_POLICY.warnAt}회 이상이면 예약할 때 경고가, ${NOSHOW_POLICY.blockAt}회 이상이면 예약이 제한돼요. 노쇼 처리가 잘못됐다면 스케줄에서 [이의 제기]를 눌러주세요.`],
    ['쿠폰', '쿠폰은 어떻게 쓰나요?', '디자인 상세에서 쿠폰을 고르면 매장 결제 금액에서 할인돼요. 예약을 취소하면 쿠폰은 다시 쓸 수 있어요.'],
    ['포인트', '포인트는 어떻게 쌓이나요?', '예약하면 100P, 후기를 쓰면 300P가 쌓여요. 예약을 취소하거나 후기를 삭제하면 해당 포인트는 회수돼요. 내역은 MY → 쿠폰 및 포인트에서 볼 수 있어요.'],
    ['후기', '후기는 언제 쓰고 고칠 수 있나요?', `시술이 완료되면 스케줄에서 쓸 수 있어요. 작성 후 ${REVIEW_EDIT_DAYS}일 이내에 수정할 수 있고, 삭제는 언제든 가능해요.`]
  ];
  const submitInquiry = () => {
    const content = inquiryForm.content.trim();
    if (content.length < 5) { showToast('문의 내용을 5자 이상 적어주세요.'); return; }
    setInquiries(prev => [{ id: 'iq_' + Date.now(), userId: uid, userName: currentUser.name, type: inquiryForm.type, content, at: Date.now(), status: 'open' }, ...prev]);
    notify('admin', `💬 새 1:1 문의 (${inquiryForm.type}): ${content.slice(0, 30)}`, { type: 'inquiry' }, 'system');
    setInquiryForm({ type: inquiryForm.type, content: '' });
    showToast('문의가 접수되었어요. 답변이 달리면 알림으로 알려드려요.');
  };
  // 관리자: 문의 답변, 공지 관리
  const [answerDrafts, setAnswerDrafts] = useState({});
  const answerInquiry = (iq) => {
    const answer = (answerDrafts[iq.id] != null ? answerDrafts[iq.id] : (iq.answer || '')).trim();
    if (!answer) { showToast('답변 내용을 입력해주세요.'); return; }
    setInquiries(prev => prev.map(x => (x.id === iq.id ? { ...x, answer, status: 'answered', answeredAt: Date.now(), answeredBy: currentUser.name } : x)));
    notify(iq.userId, `💬 1:1 문의(${iq.type})에 답변이 달렸어요.`, { type: 'inquiry', inquiryId: iq.id, label: '답변 보기' }, 'system');
    logAdmin({ targetType: 'inquiry', targetId: iq.id, targetName: `${iq.userName} 문의(${iq.type})`, field: '문의 답변', before: iq.answer ? '답변 있음' : '답변 대기', after: '답변 등록', reason: answer.slice(0, 40) });
    setAnswerDrafts({ ...answerDrafts, [iq.id]: undefined });
    showToast('답변을 등록했어요. 고객에게 알림을 보냈어요.');
  };
  const [noticeForm, setNoticeForm] = useState({ id: null, title: '', body: '' });
  const saveNotice = () => {
    const title = noticeForm.title.trim();
    const body = noticeForm.body.trim();
    if (!title || (!body && !(notices.find(x => x.id === noticeForm.id) || {}).policy)) { showToast('공지 제목과 내용을 입력해주세요.'); return; }
    if (noticeForm.id) {
      setNotices(prev => prev.map(x => (x.id === noticeForm.id ? { ...x, title, body: x.policy ? x.body : body, editedAt: Date.now() } : x)));
      logAdmin({ targetType: 'notice', targetId: noticeForm.id, targetName: title, field: '공지 수정', before: '-', after: title, reason: '공지 내용 수정' });
    } else {
      const id = 'nt_' + Date.now();
      setNotices(prev => [{ id, title, body, at: Date.now(), hidden: false }, ...prev]);
      logAdmin({ targetType: 'notice', targetId: id, targetName: title, field: '공지 등록', before: '-', after: title, reason: '새 공지' });
    }
    setNoticeForm({ id: null, title: '', body: '' });
    showToast('공지를 저장했어요.');
  };
  const toggleNoticeHidden = (nt) => {
    setNotices(prev => prev.map(x => (x.id === nt.id ? { ...x, hidden: !x.hidden } : x)));
    logAdmin({ targetType: 'notice', targetId: nt.id, targetName: nt.title, field: '공지 노출', before: nt.hidden ? '숨김' : '공개', after: nt.hidden ? '공개' : '숨김', reason: '공지 노출 변경' });
  };
  // 회원 탈퇴 (고객만. 원장님·관리자는 고객센터 문의)
  const myActiveBookings = bookings.filter(b => b.userId === uid && b.status === 'confirmed');
  const withdrawAccount = async () => {
    if (currentUser.type !== 'customer') return;
    if (myActiveBookings.length) { showToast('진행 중인 예약이 있어 탈퇴할 수 없어요.'); return; }
    if (!withdrawAgree) { showToast('안내 내용을 확인했다고 체크해주세요.'); return; }
    const ok = await askConfirm({ title: '정말 탈퇴할까요?', message: '탈퇴하면 이 계정으로 다시 로그인할 수 없고, 포인트·쿠폰은 모두 사라져요.', confirmText: '탈퇴하기', cancelText: '취소', danger: true });
    if (!ok) return;
    const id = uid;
    if (withdrawChoice === 'delete') {
      setShopReviews(prev => { const next = {}; for (const [k, list] of Object.entries(prev)) next[k] = (list || []).filter(r => r.authorId !== id); return next; });
    } else {
      setShopReviews(prev => { const next = {}; for (const [k, list] of Object.entries(prev)) next[k] = (list || []).map(r => (r.authorId === id ? { ...r, author: '탈퇴 회원', authorId: null } : r)); return next; });
    }
    setUserData(prev => { const next = { ...prev }; delete next[id]; return next; });
    setAccounts(prev => prev.map(a => (a.id === id ? { ...a, status: 'withdrawn', withdrawnAt: Date.now(), marketing: false } : a)));
    setMySheet(null);
    logout();
    showToast('탈퇴가 완료되었어요. 그동안 이용해 주셔서 감사합니다.');
  };

  // ── 예약 처리 이력 ── 원장님·고객이 처리한 취소·노쇼·시술 완료·예약 변경 (관리자 처리 이력과 따로 보관) [검토 필요: 보관 범위]
  const [bookingEvents, setBookingEvents] = usePersistentState('bookingEvents', []);
  const logBookingEvent = (b, kind, detail, actor) => {
    const s = shops.find(x => x.id === b.shopId);
    setBookingEvents(prev => [{ id: 'be_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), at: Date.now(), bookingId: b.id, shopId: b.shopId, shopName: s ? s.name : '', userName: b.userName, when: `${formatDateLabel(b.date)} ${b.time}`, kind, detail, actor, actorName: currentUser ? currentUser.name : '' }, ...prev].slice(0, 500));
  };

  // ── 노쇼 이의 제기(분쟁) ──
  const [disputes, setDisputes] = usePersistentState('disputes', []);
  const [disputeTarget, setDisputeTarget] = useState(null); // booking
  const [disputeText, setDisputeText] = useState('');
  const openDispute = (bookingId) => {
    const b = bookings.find(x => x.id === bookingId);
    if (!b || b.status !== 'noshow') { showToast('이의 제기할 수 있는 노쇼 예약이 아니에요.'); return; }
    if (disputes.some(d => d.bookingId === bookingId && d.status === 'open')) { showToast('이미 이의 제기가 접수되어 운영팀이 확인 중이에요.'); return; }
    setShowNotifications(false);
    setDisputeText('');
    setDisputeTarget(b);
  };
  const submitDispute = () => {
    const text = disputeText.trim();
    if (text.length < 5) { showToast('이의 제기 사유를 5자 이상 적어주세요.'); return; }
    const b = disputeTarget;
    setDisputes(prev => [...prev, { id: 'dp_' + Date.now(), bookingId: b.id, userId: b.userId, shopId: b.shopId, text, at: Date.now(), status: 'open' }]);
    notify('admin', `⚖️ 노쇼 이의 제기: ${b.userName} 고객 · ${formatDateLabel(b.date)} ${b.time}`);
    notify('shop:' + b.shopId, `⚖️ 고객이 노쇼 처리에 이의를 제기했어요 (${formatDateLabel(b.date)} ${b.time}). 운영팀이 확인 후 알려드려요.`);
    setDisputeTarget(null);
    showToast('이의 제기가 접수되었어요. 운영팀이 확인 후 알려드려요.');
  };
  // 관리자 판단: reverse = 노쇼 취소(예약금 환불, 노쇼 횟수 -1) / keep = 노쇼 유지
  const [disputeMemos, setDisputeMemos] = useState({});
  const resolveDispute = (dp, action) => {
    const memo = (disputeMemos[dp.id] || '').trim();
    if (!memo) { showToast('처리 사유를 입력해주세요. (처리 이력에 남아요)'); return; }
    const b = bookings.find(x => x.id === dp.bookingId);
    if (action === 'reverse' && b) {
      setBookings(prev => prev.map(x => x.id === b.id ? { ...x, status: 'noshow_reversed', refunded: true, refundAmount: b.deposit || PAYMENT_CONFIG.depositAmount, reversedAt: Date.now() } : x));
    }
    setDisputes(prev => prev.map(x => x.id === dp.id ? { ...x, status: action === 'reverse' ? 'reversed' : 'kept', resolvedAt: Date.now(), memo } : x));
    logAdmin({ targetType: 'booking', targetId: dp.bookingId, targetName: b ? `${b.userName} 고객 예약 ${formatDateLabel(b.date)} ${b.time}` : dp.bookingId, field: '노쇼 이의 제기', before: '노쇼', after: action === 'reverse' ? '노쇼 취소(예약금 환불)' : '노쇼 유지', reason: memo });
    notify(dp.userId, action === 'reverse' ? `✅ 이의 제기가 받아들여졌어요. 노쇼가 취소되고 예약금이 환불돼요. (${memo})` : `이의 제기를 검토한 결과 노쇼가 유지되었어요. (${memo})`);
    notify('shop:' + dp.shopId, action === 'reverse' ? `노쇼 이의 제기가 인정되어 해당 예약금이 정산에서 빠졌어요. (${memo})` : `노쇼 이의 제기가 기각되어 노쇼가 유지돼요.`);
    showToast(action === 'reverse' ? '노쇼를 취소했어요.' : '노쇼를 유지했어요.');
  };

  // ── 관리자: 입점 심사 ──
  const approveShop = async (shop) => {
    const reason = await askReason({ title: '입점 승인', message: `${shop.name} 입점을 승인할까요? 승인하면 고객 화면에 바로 노출돼요.`, confirmText: '승인', input: { initial: '사업자 정보 확인 완료' } });
    if (!reason) return;
    logAdmin({ targetType: 'shop', targetId: shop.id, targetName: shop.name, field: '입점 심사', before: SHOP_STATUS_LABEL[shopStatus(shop)], after: '승인', reason });
    setShops(prev => prev.map(s => s.id === shop.id ? { ...s, status: 'approved', reviewedAt: Date.now(), rejectReason: '' } : s));
    notify('shop:' + shop.id, '🎉 입점 심사가 승인되었어요! 이제 고객 화면에 매장이 노출됩니다.');
    showToast(`${shop.name} 승인 완료`);
  };
  const rejectShop = (shop) => {
    const reason = (rejectDrafts[shop.id] || '').trim();
    if (!reason) { showToast('반려 사유를 입력해주세요.'); return; }
    setShops(prev => prev.map(s => s.id === shop.id ? { ...s, status: 'rejected', reviewedAt: Date.now(), rejectReason: reason } : s));
    logAdmin({ targetType: 'shop', targetId: shop.id, targetName: shop.name, field: '입점 심사', before: SHOP_STATUS_LABEL[shopStatus(shop)], after: '반려', reason });
    notify('shop:' + shop.id, `입점 심사가 반려되었어요. 사유: ${reason}`);
    setRejectDrafts({ ...rejectDrafts, [shop.id]: '' });
    showToast(`${shop.name} 반려 처리`);
  };
  const requestReReview = () => {
    setShops(prev => prev.map(s => s.id === myShopId ? { ...s, status: 'pending', appliedAt: Date.now() } : s));
    notify('admin', `🔁 재심사 요청: ${myShop.name}`);
    showToast('재심사를 요청했어요.');
  };

  // ── 후기 신고 / 수정 / 삭제 ──
  const findReview = (reviewId) => {
    for (const [shopId, list] of Object.entries(shopReviews)) {
      const r = (list || []).find(x => x.id === reviewId);
      if (r) return { shopId, review: r };
    }
    return null;
  };
  const updateReview = (reviewId, patch) => {
    setShopReviews(prev => {
      const next = {};
      for (const [shopId, list] of Object.entries(prev)) next[shopId] = (list || []).map(r => r.id === reviewId ? { ...r, ...patch } : r);
      return next;
    });
  };
  // 신고 대상 묶음 키: 후기 신고는 후기 id, 샵 소개 신고는 'shop:샵id'
  const reportKey = (r) => (r.kind === 'shop' ? 'shop:' + r.shopId : r.reviewId);
  const resolveReport = (report, action) => {
    // action: 'hide' = 숨김, 'keep' = 유지(신고 기각)
    if (report.kind === 'shop') {
      const key = reportKey(report);
      const reasons = [...new Set(reports.filter(x => reportKey(x) === key && x.status === 'open').map(x => x.reason))].join(', ');
      const shop = shops.find(s => s.id === report.shopId);
      if (action === 'hide') {
        setShops(prev => prev.map(s => (s.id === report.shopId ? { ...s, infoHidden: true, infoHiddenReason: `신고 처리: ${reasons}` } : s)));
        notify('shop:' + report.shopId, `매장 소개·홍보 문구가 신고 검토 결과 숨김 처리되었어요. 내용을 고친 뒤 고객센터에 해제를 요청해 주세요. (신고 사유: ${reasons})`);
      }
      setReports(prev => prev.map(x => (reportKey(x) === key && x.status === 'open' ? { ...x, status: action === 'hide' ? 'hidden' : 'kept', resolvedAt: Date.now() } : x)));
      logAdmin({ targetType: 'shop', targetId: report.shopId, targetName: shop ? shop.name : report.shopId, field: action === 'hide' ? '샵 소개 숨김' : '샵 소개 신고 유지', before: '공개(신고 접수)', after: action === 'hide' ? '숨김' : '유지', reason: `신고 사유: ${reasons}` });
      showToast(action === 'hide' ? '샵 소개를 숨김 처리했어요.' : '샵 소개를 유지했어요.');
      return;
    }
    if (action === 'hide') updateReview(report.reviewId, { hidden: true, hiddenAt: Date.now() });
    setReports(prev => prev.map(x => x.reviewId === report.reviewId && x.status === 'open' ? { ...x, status: action === 'hide' ? 'hidden' : 'kept', resolvedAt: Date.now() } : x));
    if (action === 'hide') notify('shop:' + report.shopId, '신고된 후기 1건이 운영 정책에 따라 숨김 처리되었어요.');
    const reasons = [...new Set(reports.filter(x => x.reviewId === report.reviewId && x.status === 'open').map(x => x.reason))].join(', ');
    const fr = findReview(report.reviewId);
    logAdmin({ targetType: 'review', targetId: report.reviewId, targetName: fr ? `${fr.review.author} 후기 (${(shops.find(s => s.id === report.shopId) || {}).name || ''})` : report.reviewId, field: action === 'hide' ? '후기 숨김' : '후기 신고 유지', before: '공개(신고 접수)', after: action === 'hide' ? '숨김' : '유지', reason: `신고 사유: ${reasons}` });
    if (action === 'hide' && fr && fr.review.authorId) notify(fr.review.authorId, `작성하신 후기가 신고 검토 결과 숨김 처리되었어요. (신고 사유: ${reasons})`);
    showToast(action === 'hide' ? '후기를 숨김 처리했어요.' : '후기를 유지했어요.');
  };
  const [reportTarget, setReportTarget] = useState(null); // 후기: { kind: 'review', review, shopId } · 샵 소개: { kind: 'shop', shopId }
  const [reportReason, setReportReason] = useState('');
  const [editingReview, setEditingReview] = useState(null); // { id, rating, text }

  const canEditReview = (r) => r.authorId === uid && r.createdAt && Date.now() - r.createdAt <= REVIEW_EDIT_DAYS * 86400000;
  const alreadyReported = (reviewId) => reports.some(x => x.reviewId === reviewId && x.reporterId === uid);
  const alreadyReportedShop = (shopId) => reports.some(x => x.kind === 'shop' && x.shopId === shopId && x.reporterId === uid && x.status === 'open');
  // 샵이 직접 입력한 소개·한 줄 소개·강점 태그 신고 (후기 신고와 같은 사유·절차)
  const openShopReport = (shop) => {
    if (isPreview) { previewGuard(); return; }
    if (myRestriction) { showToast('이용이 제한된 계정이라 신고할 수 없어요.'); return; }
    if (alreadyReportedShop(shop.id)) { showToast('이미 신고한 매장 소개예요. 운영팀이 확인 중이에요.'); return; }
    setReportReason('');
    setReportTarget({ kind: 'shop', shopId: shop.id });
  };

  const openReport = (review, shopId) => {
    if (isPreview) { previewGuard(); return; }
    if (myRestriction) { showToast('이용이 제한된 계정이라 신고할 수 없어요.'); return; }
    if (review.authorId === uid) return;
    if (alreadyReported(review.id)) { showToast('이미 신고한 후기예요. 운영팀이 확인 중이에요.'); return; }
    setReportReason('');
    setReportTarget({ kind: 'review', review, shopId });
  };
  const submitReport = () => {
    if (!reportTarget) return;
    if (!reportReason) { showToast('신고 사유를 선택해주세요.'); return; }
    if (reportTarget.kind === 'shop') {
      const shop = shops.find(s => s.id === reportTarget.shopId);
      setReports(prev => [...prev, { id: 'rp_' + Date.now(), kind: 'shop', reviewId: null, shopId: reportTarget.shopId, reason: reportReason, reporterId: uid, at: Date.now(), status: 'open' }]);
      notify('admin', `🚩 샵 소개 신고 (${reportReason}): ${shop ? shop.name : ''}`);
    } else {
      setReports(prev => [...prev, { id: 'rp_' + Date.now(), kind: 'review', reviewId: reportTarget.review.id, shopId: reportTarget.shopId, reason: reportReason, reporterId: uid, at: Date.now(), status: 'open' }]);
      notify('admin', `🚩 후기 신고 (${reportReason}): "${reportTarget.review.comment.slice(0, 24)}"`);
    }
    setReportTarget(null);
    showToast('신고가 접수되었어요. 운영팀이 확인 후 처리합니다.');
  };

  const saveReviewEdit = () => {
    if (!editingReview) return;
    const found = findReview(editingReview.id);
    if (!found || !canEditReview(found.review)) { showToast(`작성 후 ${REVIEW_EDIT_DAYS}일이 지나 수정할 수 없어요.`); setEditingReview(null); return; }
    if (!editingReview.rating) { showToast('별점을 선택해주세요.'); return; }
    const comment = editingReview.text.trim() || '(작성한 후기 없음)';
    updateReview(editingReview.id, { rating: editingReview.rating, comment, editedAt: Date.now() });
    setMyHistory(myHistory.map(h => h.reviewId === editingReview.id ? { ...h, myRating: editingReview.rating, myReview: comment } : h));
    setEditingReview(null);
    showToast('후기를 수정했어요.');
  };
  const deleteReview = async (r) => {
    if (r.authorId !== uid) return;
    const reclaim = r.pointsGranted || 0;
    if (!(await askConfirm({ title: '후기 삭제', message: `이 후기를 삭제할까요? 삭제한 후기는 되돌릴 수 없어요.${reclaim ? `\n후기 작성으로 받은 ${reclaim}P도 회수돼요.` : ''}`, confirmText: '삭제', danger: true }))) return;
    if (reclaim) setMyPoints(Math.max(0, myPoints - reclaim));
    if (reclaim) addPointLog(uid, 'point', `-${reclaim}P`, '후기 삭제로 적립 회수');
    setShopReviews(prev => {
      const next = {};
      for (const [shopId, list] of Object.entries(prev)) next[shopId] = (list || []).filter(x => x.id !== r.id);
      return next;
    });
    setMyHistory(myHistory.map(h => h.reviewId === r.id ? { ...h, myRating: 0, myReview: '(삭제한 후기)', reviewId: null } : h));
    if (editingReview && editingReview.id === r.id) setEditingReview(null);
    showToast(reclaim ? `후기를 삭제했어요. (${reclaim}P 회수)` : '후기를 삭제했어요.');
  };

  // 본인 후기: 수정(7일 이내)·삭제 / 타인 후기: 신고 — 샵 상세와 MY 후기 히스토리에서 공용으로 사용
  const renderReviewActions = (r, shopId) => {
    if (r.authorId === uid) {
      if (editingReview && editingReview.id === r.id) {
        return (
          <div className="mt-2 space-y-2">
            <div className="flex gap-1" role="radiogroup" aria-label="별점 수정">
              {[1, 2, 3, 4, 5].map(n => (
                <button key={n} role="radio" aria-checked={editingReview.rating === n} aria-label={`${n}점`} onClick={() => setEditingReview({ ...editingReview, rating: n })} className="text-xl leading-none">{n <= editingReview.rating ? '⭐' : '☆'}</button>
              ))}
            </div>
            <textarea aria-label="후기 수정" value={editingReview.text} maxLength={500} rows={2} onChange={(e) => setEditingReview({ ...editingReview, text: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none resize-none" />
            <div className="flex gap-2">
              <button onClick={() => setEditingReview(null)} className="flex-1 text-xs font-bold py-2 rounded-lg border border-slate-200 text-slate-600">취소</button>
              <button onClick={saveReviewEdit} className="flex-1 text-xs font-bold py-2 rounded-lg text-white" style={{ background: PINK }}>수정 저장</button>
            </div>
          </div>
        );
      }
      return (
        <div className="mt-2 flex gap-3 text-xs font-bold text-slate-600">
          {canEditReview(r)
            ? <button onClick={() => setEditingReview({ id: r.id, rating: r.rating, text: r.comment === '(작성한 후기 없음)' ? '' : r.comment })} className="underline">수정</button>
            : <span className="text-slate-500 font-semibold">수정 기간({REVIEW_EDIT_DAYS}일) 지남</span>}
          <button onClick={() => deleteReview(r)} className="underline">삭제</button>
          {r.hidden && <span className="text-rose-700">운영 정책에 따라 숨김 처리됨</span>}
        </div>
      );
    }
    return (
      <div className="mt-1.5 text-right">
        <button onClick={() => openReport(r, shopId)} className="text-xs font-semibold text-slate-500 underline" aria-label={`${r.author} 후기 신고`}>
          {alreadyReported(r.id) ? '신고 접수됨' : '신고'}
        </button>
      </div>
    );
  };

  const unhideReview = async (reviewId) => {
    const fr = findReview(reviewId);
    if (!fr) return;
    await adminHideReview(fr.review, fr.shopId);
  };

  // ── 샵 평점·리뷰 수 ──
  // 기존 가상 샵의 rating/reviews 는 '앱 출시 전 누적값(기준값)'으로 보고, 앱에서 작성된 후기(createdAt 있음)를 더해 계산.
  // 숨김 처리된 후기는 빼고, 후기가 하나도 없으면 rating=null → '신규'로 표시.
  const shopStats = (s) => {
    const list = shopReviews[s.id] || [];
    const added = list.filter(r => r.createdAt && !r.hidden);
    const hiddenSeed = list.filter(r => !r.createdAt && r.hidden);
    const baseCount = Math.max(0, (s.reviews || 0) - hiddenSeed.length);
    const baseSum = Math.max(0, (s.rating || 0) * (s.reviews || 0) - hiddenSeed.reduce((a, r) => a + r.rating, 0));
    const count = baseCount + added.length;
    if (!count) return { rating: null, count: 0 };
    return { rating: Math.round(((baseSum + added.reduce((a, r) => a + r.rating, 0)) / count) * 10) / 10, count };
  };
  const ratingText = (s) => { const st = shopStats(s); return st.rating == null ? '신규 매장' : `⭐ ${st.rating.toFixed(1)} (${st.count})`; };

  // ── 디자인별 후기·별점 ──
  // 디자인 후기 = 이 디자인을 예약한 건에 남긴 후기(숨김 제외). 기존 샘플 디자인의 rating/reviews 는 기준값으로 더함.
  // 기준값도 앱 후기도 없으면 rating=null → "신규" 표시 (★5 (0) 같은 표시 방지)
  const bookingDesignOf = (bookingId) => { const b = bookings.find(x => x.id === bookingId); return b ? b.designId : null; };
  const designReviewsOf = (d) => (shopReviews[d.shopId] || []).filter(r => r.bookingId && !r.hidden && bookingDesignOf(r.bookingId) === d.id);
  const designStats = (d) => {
    const added = designReviewsOf(d);
    const baseCount = d.reviews || 0;
    const count = baseCount + added.length;
    if (!count) return { rating: null, count: 0 };
    const sum = (d.rating || 0) * baseCount + added.reduce((a, r) => a + r.rating, 0);
    return { rating: Math.round((sum / count) * 10) / 10, count };
  };
  const designRating = (d) => {
    const st = designStats(d);
    return st.rating == null
      ? <span className="text-xs font-bold px-1.5 py-0.5 rounded" style={{ color: PINK, background: '#FFF0F4' }}>신규</span>
      : <span className="text-xs font-bold text-amber-500">⭐ {st.rating.toFixed(1)} <span className="text-slate-500 font-medium">({st.count})</span></span>;
  };
  // 정렬용: 후기 없는 신규 디자인은 맨 뒤 (예전엔 5.0으로 1등이 됐음)
  const ratingKey = (d) => { const st = designStats(d); return st.rating == null ? -1 : st.rating; };
  const designInfo = (d) => {
    const biz = d.bizType || ((shops.find(s => s.id === d.shopId) || {}).bizType) || 'nail';
    const hasDuration = Number(d.durationMin) > 0;
    const hasIncludes = Array.isArray(d.includes) && d.includes.length > 0;
    return {
      duration: hasDuration ? Number(d.durationMin) : (DEFAULT_DURATION_MIN[d.cat] || 60),
      includes: (hasIncludes ? d.includes : (DEFAULT_INCLUDES[biz] || DEFAULT_INCLUDES.nail)).filter(t => !((d.options || []).length && /제거는 매장 문의/.test(t))),
      isDefault: !hasDuration || !hasIncludes
    };
  };

  // 옵션 선택 합계: 기본가 + 옵션 금액, 기본 소요 시간 + 옵션 시간. 쿠폰은 합계에 적용
  const optionsOf = (d) => (d && Array.isArray(d.options) ? d.options : []);
  const bookingTotals = (d, optionIds) => {
    const opts = optionsOf(d).filter(o => (optionIds || []).includes(o.id));
    const optionPrice = opts.reduce((s, o) => s + (Number(o.price) || 0), 0);
    const optionMin = opts.reduce((s, o) => s + (Number(o.minutes) || 0), 0);
    const subtotal = d.price + optionPrice;
    return { opts, optionPrice, optionMin, subtotal, final: getDiscountedPrice(subtotal), duration: designInfo(d).duration + optionMin };
  };

  // ── 노쇼 누적 ──
  // 노쇼 횟수 = 노쇼 처리된 예약 수 + 관리자 정정분(noShowAdjust). 0 아래로는 내려가지 않음
  const noShowCount = (userId) => Math.max(0, bookings.filter(b => b.userId === userId && b.status === 'noshow').length + ((accounts.find(a => a.id === userId) || {}).noShowAdjust || 0));

  // ── 정산 (예시 계산) ──
  // ── 이번 달 매장 숫자 (리포트·원장님 홈 정산 카드·관리자 정산이 모두 이 함수 하나로 계산) ──
  // 기준: 예약 시술일이 이번 달인 예약. 금액·수수료율은 예시 설정값
  //  · 매출 = 시술 완료 예약의 결제 예정 금액(쿠폰 반영)
  //  · 예약금 수입 = 노쇼 예약금 + 고객 사정 늦은 취소 예약금(settlementDeposit)
  //  · 수수료 = (매출 + 예약금 수입) × 수수료율, 정산 예정 = 매출 + 예약금 수입 − 수수료
  //  · 가게 사정·천재지변 취소, 이의 제기로 취소된 노쇼는 정산 제외
  const monthStart = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1).getTime(); })();
  const nextMonthStart = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth() + 1, 1).getTime(); })();
  const inThisMonth = (b) => { const t = slotTime(b.date, b.time); return t >= monthStart && t < nextMonthStart; };
  const bookingPrice = (b) => { const d = designs.find(x => x.id === b.designId); return b.finalPrice != null ? b.finalPrice : (d ? d.price : 0); };
  // 월 키(YYYY-MM) → [시작, 다음 달 시작]
  const monthKeyNow = (() => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}`; })();
  const monthRange = (mk) => { const [y, m] = mk.split('-').map(Number); return [new Date(y, m - 1, 1).getTime(), new Date(y, m, 1).getTime()]; };
  const shiftMonth = (mk, k) => { const [y, m] = mk.split('-').map(Number); const t = new Date(y, m - 1 + k, 1); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}`; };
  const monthLabel = (mk) => { const [y, m] = mk.split('-').map(Number); return `${y}년 ${m}월`; };
  const payoutDateOf = (mk) => { const [y, m] = mk.split('-').map(Number); const t = new Date(y, m, SETTLEMENT_CONFIG.payoutDay); return `${t.getMonth() + 1}월 ${t.getDate()}일`; };
  const inMonth = (b, mk) => { const [a, z] = monthRange(mk); const t = slotTime(b.date, b.time); return t >= a && t < z; };
  // 예약 1건의 정산 내역: 시술 대금(완료) 또는 예약금 수입(노쇼·늦은 취소)과 수수료
  const settlementLine = (b) => {
    const price = b.status === 'completed' ? bookingPrice(b) : 0;
    const deposit = b.status === 'noshow' ? (b.deposit || PAYMENT_CONFIG.depositAmount) : b.status === 'cancelled' ? (b.settlementDeposit || 0) : 0;
    const commission = Math.round((price + deposit) * SETTLEMENT_CONFIG.commissionRate);
    return { b, price, deposit, commission, net: price + deposit - commission };
  };
  // 정산 지급 기록 (관리자 '정산 완료(지급) 처리') — 실제 송금은 서버·PG 정산 연동 후 [검토 필요]
  const [payouts, setPayouts] = usePersistentState('payouts', []);
  const payoutOf = (shopId, mk) => payouts.find(p => p.shopId === shopId && p.month === mk);
  const shopSettlement = (s, mk) => {
    const mine = bookings.filter(b => b.shopId === s.id && (mk ? inMonth(b, mk) : inThisMonth(b)));
    const done = mine.filter(b => b.status === 'completed');
    const sales = done.reduce((sum, b) => sum + bookingPrice(b), 0);
    const noShowDeposit = mine.filter(b => b.status === 'noshow').reduce((sum, b) => sum + (b.deposit || PAYMENT_CONFIG.depositAmount), 0);
    const lateCancelDeposit = mine.filter(b => b.status === 'cancelled').reduce((sum, b) => sum + (b.settlementDeposit || 0), 0);
    const depositIncome = noShowDeposit + lateCancelDeposit;
    const commission = Math.round((sales + depositIncome) * SETTLEMENT_CONFIG.commissionRate);
    const shopCancelCount = mine.filter(b => b.status === 'cancelled' && CANCEL_REASONS[b.cancelReason] && CANCEL_REASONS[b.cancelReason].byShop).length;
    return {
      shop: s, count: done.length, sales, noShowDeposit, lateCancelDeposit, depositIncome, commission,
      payout: sales + depositIncome - commission,
      booked: mine.filter(b => b.status !== 'cancelled').length,
      noShowCount: mine.filter(b => b.status === 'noshow').length,
      cancelCount: mine.filter(b => b.status === 'cancelled').length,
      shopCancelCount, shopCancelWarn: shopCancelCount >= SHOP_CANCEL_POLICY.warnPerMonth
,      lines: mine.map(settlementLine).filter(l => l.price || l.deposit), month: mk || monthKeyNow
    };
  };
  const [adminSettleMonth, setAdminSettleMonth] = useState(() => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}`; });
  const markPayout = async (r, mk) => {
    if (payoutOf(r.shop.id, mk)) return;
    const reason = await askReason({ title: '정산 완료(지급) 처리', details: [['매장', r.shop.name], ['정산 월', monthLabel(mk)], ['지급 금액', `${r.payout.toLocaleString()}원`]], message: '실제 송금 후 기록만 남겨요. (PG·은행 연동 전)', confirmText: '지급 처리', input: { label: '메모 (필수 · 예: 이체 확인번호)', placeholder: '예) 11/10 이체 완료' } });
    if (!reason) return;
    setPayouts(prev => [{ id: 'po_' + Date.now(), shopId: r.shop.id, month: mk, amount: r.payout, at: Date.now(), by: currentUser.name, memo: reason }, ...prev]);
    logAdmin({ targetType: 'shop', targetId: r.shop.id, targetName: r.shop.name, field: '정산 지급', before: `${monthLabel(mk)} 지급 대기`, after: `${r.payout.toLocaleString()}원 지급 완료`, reason });
    notify('shop:' + r.shop.id, `💰 ${monthLabel(mk)} 정산금 ${r.payout.toLocaleString()}원이 지급 처리되었어요.`);
    showToast('지급 처리했어요. 지급 이력에 남았어요.');
  };
  const downloadSettlementCsv = (mk) => {
    const rows = settlementRows(mk);
    const head = ['정산월', '샵', '완료 건수', '매출', '예약금 수입', '수수료', '정산 예정', '가게 사정 취소', '지급 상태', '지급일'];
    const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const lines = [head, ...rows.map(r => { const p = payoutOf(r.shop.id, mk); return [mk, r.shop.name, r.count, r.sales, r.depositIncome, r.commission, r.payout, r.shopCancelCount, p ? '지급 완료' : '미지급', p ? new Date(p.at).toLocaleDateString('ko-KR') : '']; })].map(l => l.map(esc).join(','));
    try {
      const url = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = `nailmohae-settlement-${mk}.csv`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('정산 CSV를 내려받았어요. (엑셀에서 열 수 있어요)');
    } catch (e) { showToast('CSV 파일을 만들지 못했어요.'); }
  };
  // 처리 이력 필터
  const [logView, setLogView] = useState('admin');
  const [logType, setLogType] = useState('all');
  const [logFrom, setLogFrom] = useState('');
  const [logTo, setLogTo] = useState('');
  const [logQuery, setLogQuery] = useState('');
  const settlementRows = (mk) => shops.filter(s => shopStatus(s) === 'approved').map(s => shopSettlement(s, mk));

  // 다가오는 예약 알림 (앱 안): 하루 전 알림(REMINDER_POLICY.dayBeforeHours 이내 진입 시 1회) + 방문 임박 알림(soonHours 전, 따로 1회)
  useEffect(() => {
    if (!currentUser) return;
    const now = Date.now();
    const mine = bookings.filter(b => b.userId === uid && b.status === 'confirmed' && slotTime(b.date, b.time) > now);
    const left = (b) => slotTime(b.date, b.time) - now;
    const soon = mine.filter(b => !b.remindedSoon && left(b) <= REMINDER_POLICY.soonHours * 3600000);
    const dayBefore = mine.filter(b => !b.reminded && !soon.includes(b) && left(b) <= REMINDER_POLICY.dayBeforeHours * 3600000);
    if (!soon.length && !dayBefore.length) return;
    dayBefore.forEach(b => {
      const s = shops.find(x => x.id === b.shopId);
      notify(uid, `⏰ 예약 알림: ${formatDateLabel(b.date)} ${b.time} ${s ? s.name : ''} 방문 예정이에요.`, { type: 'booking', bookingId: b.id }, 'booking');
    });
    soon.forEach(b => {
      const s = shops.find(x => x.id === b.shopId);
      notify(uid, `🔔 방문 임박: 오늘 ${b.time} ${s ? s.name : ''} 예약이 약 ${Math.max(1, Math.round(left(b) / 3600000))}시간 남았어요.`, { type: 'booking', bookingId: b.id }, 'booking');
    });
    setBookings(prev => prev.map(b => (soon.some(x => x.id === b.id) ? { ...b, reminded: true, remindedSoon: true } : dayBefore.some(x => x.id === b.id) ? { ...b, reminded: true } : b)));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [uid, bookings]);

  // 저장 실패 안내 (사진을 많이 올려 브라우저 저장 공간이 꽉 찬 경우 등). 같은 안내는 10초에 한 번만.
  useEffect(() => {
    let last = 0;
    const onErr = () => {
      if (Date.now() - last < 10000) return;
      last = Date.now();
      showToast('⚠️ 저장 공간이 부족해 일부 내용이 저장되지 않았어요. 사진을 줄이거나 지운 뒤 다시 시도해주세요.');
    };
    window.addEventListener('nailmohae:storage-error', onErr);
    return () => window.removeEventListener('nailmohae:storage-error', onErr);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // (예전에 있던 "휠을 가로 스크롤로 바꾸는 기능"은 세로 스크롤을 막아서 제거함 — 가로 목록은 HRow 참고)

  // 공유 링크로 들어온 경우: 로그인되면 해당 디자인·샵을 열고 주소의 파라미터는 지움
  useEffect(() => {
    if (!pendingLink || linkHandled || !currentUser || appMode !== 'B2C') return;
    setLinkHandled(true);
    if (pendingLink.type === 'design') {
      const d = publicDesigns.find(x => x.id === pendingLink.id);
      if (d) openDesign(d); else showToast('공유된 디자인을 찾을 수 없어요. (숨김·삭제됐거나, 다른 기기에서 만든 링크일 수 있어요)');
    } else {
      const s = publicShops.find(x => x.id === pendingLink.id);
      if (s) setSelectedShop(s); else showToast('공유된 매장을 찾을 수 없어요.');
    }
    try { window.history.replaceState(null, '', window.location.pathname); } catch (e) { /* noop */ }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendingLink, linkHandled, currentUser, appMode]);

  // 탭(카테고리·업종 포함)을 바꾸면 해당 화면 스크롤을 맨 위로. 상세 팝업도 다른 항목을 열면 맨 위부터.
  const b2cScrollRef = useRef(null);
  const b2bScrollRef = useRef(null);
  const adminScrollRef = useRef(null);
  const designScrollRef = useRef(null);
  const shopScrollRef = useRef(null);
  const toTop = (ref) => { if (ref.current) ref.current.scrollTop = 0; };
  useEffect(() => { toTop(b2cScrollRef); }, [b2cTab, category, bizType, appMode]);
  useEffect(() => { toTop(b2bScrollRef); }, [b2bTab, appMode]);
  useEffect(() => { toTop(adminScrollRef); }, [adminTab, appMode]);
  useEffect(() => { toTop(designScrollRef); }, [selectedDesign && selectedDesign.id]);
  useEffect(() => { toTop(shopScrollRef); }, [selectedShop && selectedShop.id]);

  // Esc 로 맨 위 모달 닫기 (키보드 접근성)
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (confirmDlg) { closeConfirm(false); return; }
      if (reportTarget) setReportTarget(null);
      else if (showTermsModal) setShowTermsModal(false);
      else if (showPrivacyModal) setShowPrivacyModal(false);
      else if (showMarketingModal) setShowMarketingModal(false);
      else if (showNotifications) setShowNotifications(false);
      else if (selectedHistoryId) setSelectedHistoryId(null);
      else if (selectedDesign) { setSelectedDesign(null); resetBookingFlow(); }
      else if (selectedShop) setSelectedShop(null);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  const submitReview = (booking) => {
    if (isPreview) { previewGuard(); return; }
    if (myRestriction) { showToast('이용이 제한된 계정이라 후기를 쓸 수 없어요.'); return; }
    const draft = reviewDrafts[booking.id] || { rating: 0, text: '' };
    if (!draft.rating) {
      showToast('별점을 선택해주세요!');
      return;
    }
    const design = designs.find(d => d.id === booking.designId);
    const shop = shops.find(s => s.id === booking.shopId);
    // 날짜는 항상 예약 시술일(예약일). 완료 처리한 시각은 booking.completedAt 에 따로 저장되어 있음
    const dateStr = dotsFromKey(booking.date);
    const comment = draft.text.trim() || '(작성한 후기 없음)';
    const newReview = { id: 'r_' + Date.now(), author: maskName(currentUser.name), authorId: uid, createdAt: Date.now(), rating: draft.rating, date: dateStr, comment, bookingId: booking.id, pointsGranted: 300, photo: draft.photo || undefined };
    setShopReviews({
      ...shopReviews,
      [booking.shopId]: [newReview, ...(shopReviews[booking.shopId] || [])]
    });
    setMyHistory([{
      id: 'h_' + Date.now(),
      designId: booking.designId,
      shopName: shop ? shop.name : (design ? design.shopName : ''),
      date: dateStr,
      myRating: draft.rating,
      myReview: comment,
      reviewId: newReview.id
,      myPhoto: draft.photo || undefined
    }, ...myHistory]);
    setBookings(prev => prev.map(b => b.id === booking.id ? { ...b, reviewed: true } : b));
    notify('shop:' + booking.shopId, `⭐ 새 리뷰 ${draft.rating}점: "${comment.slice(0, 30)}"`);
    addPointLog(uid, 'point', '+300P', `후기 작성 · ${shop ? shop.name : ''}`);
    setMyPoints(myPoints + 300);
    showToast('🎉 후기 감사합니다! 300P가 적립되었어요.');
  };

  const appliedCoupon = myCoupons.find(c => c.id === appliedCouponId && !c.used);
  const getDiscountedPrice = (price) => {
    if (!appliedCoupon) return price;
    if (appliedCoupon.type === 'percent') return Math.round(price * (1 - appliedCoupon.value / 100));
    return Math.max(0, price - appliedCoupon.value);
  };

  const toggleLike = (e, id) => {
    e.stopPropagation();
    if (isPreview) { previewGuard(); return; }
    setLikedIds(likedIds.includes(id) ? likedIds.filter(x => x !== id) : [...likedIds, id]);
  };

  const openShopFromDesign = (design) => {
    const shop = shops.find(s => s.id === design.shopId);
    if (shop) {
      setSelectedDesign(null);
      setBookingStep(0);
      setSelectedShop(shop);
    }
  };

  // 상품 순서: 원장님이 ▲▼로 바꾼 sortOrder 순 (없으면 등록 순)
  const byShopOrder = (a, b) => ((a.sortOrder ?? 1e9) - (b.sortOrder ?? 1e9));
  const myDesigns = designs.filter(d => d.shopId === myShopId).sort(byShopOrder);
  const moveDesign = (id, dir) => {
    const list = myDesigns.map(d => d.id);
    const i = list.indexOf(id); const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    setDesigns(prev => prev.map(d => (list.includes(d.id) ? { ...d, sortOrder: list.indexOf(d.id) } : d)));
  };

  const chargeCredit = (amount) => {
    setCredit(credit + amount);
    addCreditLog('charge', amount, '크레딧 충전');
    showToast(`💳 크레딧 ${amount.toLocaleString()}원이 충전되었습니다. 현재 잔액: ${(credit + amount).toLocaleString()}P`);
  };

  const registerBank = (e) => {
    e.preventDefault();
    if (!bankForm.bank || !bankForm.account || !bankForm.holder) {
      showToast('은행명, 계좌번호, 예금주를 모두 입력해주세요.');
      return;
    }
    setBankInfo({ ...bankForm });
    setShowBankForm(false);
    showToast('✅ 정산 계좌가 등록되었습니다. 고객 결제 대금이 이 계좌로 정산됩니다.');
  };

  const toggleDesignVisibility = (id) => {
    setHiddenDesignIds(hiddenDesignIds.includes(id) ? hiddenDesignIds.filter(x => x !== id) : [...hiddenDesignIds, id]);
  };

  const deleteMyDesign = async (id) => {
    const target = designs.find(d => d.id === id);
    if (!target) return;
    const active = designActiveBookings(id);
    if (active.length) {
      const hide = await askConfirm({ title: '삭제할 수 없어요', message: `이 디자인에 진행 중인 예약이 ${active.length}건 있어요. 예약이 끝날 때까지는 삭제 대신 ‘숨김’으로 고객 화면에서만 내릴 수 있어요. 지금 숨길까요?`, confirmText: '숨김으로 내리기', cancelText: '닫기' });
      if (hide && !hiddenDesignIds.includes(id)) toggleDesignVisibility(id);
      return;
    }
    const reason = await askReason({ title: '디자인 삭제', message: `‘${target.title}’ 디자인을 삭제할까요?\n삭제하면 고객 화면과 광고에서 사라지고 되돌릴 수 없어요. 잠시 내리려면 ‘숨김’을 쓰세요.`, confirmText: '삭제', danger: true, input: { label: '삭제 사유 (필수 · 기록에 남아요)', placeholder: '예) 더 이상 시술하지 않는 디자인' } });
    if (!reason) return;
    setDesigns(designs.filter(d => d.id !== id));
    logAdmin({ actorType: 'owner', targetType: 'design', targetId: id, targetName: `${target.title} (${target.shopName})`, field: '디자인 삭제(원장님)', before: `${target.title} · ${target.price.toLocaleString()}원`, after: '삭제', reason });
    showToast('디자인을 삭제했어요.');
  };

  const AD_COST = { '검색 상단 고정': 3000, '홈 배너 노출': 5000, '카테고리 상단 고정': 2000 };

  const [profileSavedAt, setProfileSavedAt] = useState(0); // 마지막 저장 시각 (버튼 옆 표시)
  const saveProfile = async (e) => {
    e.preventDefault();
    if (!profileForm.name || !profileForm.location) {
      showToast('샵 이름과 주소는 필수 입력 항목입니다.');
      return;
    }
    if (geo.status === 'loading') return;
    const strengthList = String(profileForm.strengths || '').split(',').map(t => t.trim()).filter(Boolean);
    if (strengthList.length > MAX_STRENGTH_TAGS) { showToast(`강점 태그는 최대 ${MAX_STRENGTH_TAGS}개까지 입력할 수 있어요.`); return; }
    let next = profileForm;
    let warn = '';
    if (geoStale) {
      // 주소가 바뀌었는데 위치를 아직 안 찾았으면 저장 전에 자동으로 찾기
      const r = await findLocation(profileForm);
      if (r) next = { ...profileForm, lat: r.lat, lng: r.lng };
      else warn = '\n⚠️ 새 주소의 위치를 찾지 못해 지도 핀은 이전 위치로 유지됩니다.';
    }
    // 좌표가 비어 있으면(undefined) 기존 매장 좌표를 덮어쓰지 않음
    const patch = Object.fromEntries(Object.entries(next).filter(([, v]) => v !== undefined));
    patch.strengths = strengthList;
    patch.tagline = String(profileForm.tagline || '').trim();
    patch.notice = String(profileForm.notice || '').trim();
    patch.promo = String(profileForm.promo || '').trim();
    if (patch.weeklyHours) {
      const bad = patch.weeklyHours.findIndex(h => !h.closed && !(h.open && h.close && toMin(h.open) < toMin(h.close)));
      if (bad >= 0) { showToast(`${WEEKDAY_KO[bad]}요일 영업 시작·종료 시간을 확인해주세요.`); return; }
    }
    if (patch.lastBookingTime && !/^\d{2}:\d{2}$/.test(patch.lastBookingTime)) { showToast('예약 마감 시간은 18:00 처럼 입력해주세요.'); return; }
    patch.img = (patch.imgs || [])[0] || myShop.img;
    setShops(prev => prev.map(s => s.id === myShopId ? { ...s, ...patch } : s));
    setProfileSavedAt(Date.now());
    showToast('✅ 저장되었어요. 고객 화면에 바로 반영돼요.' + warn);
  };

  const [adErrors, setAdErrors] = useState({});
  const startEditAd = (ad) => {
    setEditingAdId(ad.id);
    setAdForm({ designId: ad.designId, type: ad.type, days: ad.days, keyword: ad.keyword || '' });
  };

  const cancelAdForm = () => {
    setEditingAdId(null);
    setAdErrors({});
    setAdForm({ designId: '', type: '검색 상단 고정', days: 7, keyword: '' });
  };

  const toggleAdPause = (ad) => {
    if (ad.paused) {
      // 재개: 멈춘 기간만큼 종료일을 뒤로 미룸 (남은 일수 유지)
      const pausedFor = Date.now() - (ad.pausedAt || Date.now());
      setAds(ads.map(a => (a.id === ad.id ? { ...a, paused: false, pausedAt: null, startAt: (a.startAt || Date.now()) + pausedFor } : a)));
      showToast('광고를 다시 시작했어요. 멈춘 기간만큼 종료일이 늦춰져요.');
    } else {
      setAds(ads.map(a => (a.id === ad.id ? { ...a, paused: true, pausedAt: Date.now() } : a)));
      showToast('광고를 일시정지했어요. 고객 화면에 나오지 않아요.');
    }
  };
  const extendAd = async (ad) => {
    const v = await askConfirm({ title: '광고 연장', message: `1일당 ${AD_COST[ad.type].toLocaleString()}P · 보유 ${credit.toLocaleString()}P`, input: { label: '연장할 일수 (1~30)', placeholder: '7', initial: '7' }, confirmText: '연장하기' });
    if (v == null) return;
    const days = Math.round(Number(v));
    if (!(days >= 1 && days <= 30)) { showToast('연장 일수는 1~30일로 입력해주세요.'); return; }
    const cost = AD_COST[ad.type] * days;
    if (cost > credit) { showToast(`크레딧이 부족해요. 필요 ${cost.toLocaleString()}P (보유 ${credit.toLocaleString()}P)`); return; }
    setCredit(credit - cost);
    addCreditLog('use', cost, `광고 연장 · ${ad.type} ${days}일`);
    // 이미 끝난 광고는 오늘부터 다시 시작
    setAds(ads.map(a => (a.id === ad.id ? (adEnded(a) ? { ...a, status: '진행중', startAt: Date.now(), days, cost: a.cost + cost } : { ...a, days: a.days + days, cost: a.cost + cost }) : a)));
    showToast(`광고를 ${days}일 연장했어요. ${cost.toLocaleString()}P 차감`);
  };

  const deleteAd = async (id) => {
    const ad = ads.find(a => a.id === id);
    if (!(await askConfirm({ title: '광고 삭제', message: '이 광고를 삭제할까요? 남은 크레딧은 환불되지 않습니다.', confirmText: '삭제', danger: true }))) return;
    setAds(ads.filter(a => a.id !== id));
    if (editingAdId === id) cancelAdForm();
  };

  const submitAd = (e) => {
    e.preventDefault();
    // 필수 항목 검사 — 빠진 항목은 입력칸 아래에 안내
    const err = {};
    if (!adForm.designId) err.designId = '광고할 디자인을 선택해주세요.';
    else if (hiddenDesignIds.includes(adForm.designId)) err.designId = '숨김 처리한 디자인은 광고할 수 없어요. 상품관리에서 다시 노출해 주세요.';
    if (adForm.type === '검색 상단 고정' && !adForm.keyword.trim()) err.keyword = '검색 상단 고정 광고는 타겟 키워드가 필요해요. (이 키워드로 검색할 때 맨 위에 나와요)';
    if (!Number.isInteger(adForm.days) || adForm.days < 1 || adForm.days > 90) err.days = '광고 기간은 1~90일로 입력해주세요.';
    setAdErrors(err);
    if (Object.keys(err).length) { showToast('필수 항목을 확인해주세요.'); return; }
    const newCost = AD_COST[adForm.type] * adForm.days;

    if (editingAdId) {
      const existing = ads.find(a => a.id === editingAdId);
      const diff = newCost - (existing ? existing.cost : 0);
      if (diff > 0 && diff > credit) {
        return showToast(`크레딧이 부족합니다. 추가로 필요한 크레딧: ${diff.toLocaleString()}P (보유: ${credit.toLocaleString()}P)`);
      }
      if (diff) addCreditLog(diff > 0 ? 'use' : 'refund', Math.abs(diff), diff > 0 ? '광고 수정(추가 차감)' : '광고 수정(차액 환불)');
      setCredit(credit - diff);
      setAds(ads.map(a => a.id === editingAdId ? { ...a, designId: adForm.designId, type: adForm.type, days: adForm.days, keyword: adForm.keyword, cost: newCost } : a));
      showToast(diff === 0 ? '✏️ 광고 정보가 수정되었습니다.' : `✏️ 광고가 수정되었습니다. ${diff > 0 ? diff.toLocaleString() + 'P가 추가 차감' : Math.abs(diff).toLocaleString() + 'P가 환불'}되었습니다.`);
    } else {
      if (newCost > credit) return showToast(`크레딧이 부족합니다. 필요 크레딧: ${newCost.toLocaleString()}P (보유: ${credit.toLocaleString()}P)`);
      addCreditLog('use', newCost, `광고 등록 · ${adForm.type} ${adForm.days}일`);
      setCredit(credit - newCost);
      setAds([{ id: 'ad_' + Date.now(), designId: adForm.designId, type: adForm.type, days: adForm.days, keyword: adForm.keyword.trim(), cost: newCost, status: '진행중', startAt: Date.now() }, ...ads]);
      showToast(`📢 광고가 등록되었습니다! ${newCost.toLocaleString()}P가 차감되었습니다.`);
    }
    cancelAdForm();
  };

  const readImageFile = async (file) => {
    if (!file) return null;
    if (!/^image\//.test(file.type)) { showToast('이미지 파일만 올릴 수 있어요.'); return null; }
    if (file.size > MAX_UPLOAD_BYTES) { showToast('15MB 이하 사진만 올릴 수 있어요.'); return null; }
    try { return await compressImage(file); } catch (err) { showToast('사진을 읽지 못했어요.'); return null; }
  };
  const readUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    return readImageFile(file);
  };

  const handleHistoryPhotoSelect = async (e, historyId) => {
    const dataUrl = await readUpload(e);
    if (!dataUrl) return;
    setMyHistory(myHistory.map(h => h.id === historyId ? { ...h, myPhoto: dataUrl } : h));
  };

  const saveDiary = (historyId) => {
    setMyHistory(myHistory.map(h => h.id === historyId ? { ...h, diary: diaryDraft } : h));
    showToast('📔 일기가 저장되었습니다!');
  };

  const handleFileSelect = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    const room = MAX_DESIGN_PHOTOS - newImgs.length;
    if (room <= 0) { showToast(`사진은 최대 ${MAX_DESIGN_PHOTOS}장까지 올릴 수 있어요.`); return; }
    if (files.length > room) showToast(`최대 ${MAX_DESIGN_PHOTOS}장이라 앞의 ${room}장만 올렸어요.`);
    const out = [];
    for (const file of files.slice(0, room)) { const url = await readImageFile(file); if (url) out.push(url); }
    if (out.length) setNewImgs(prev => [...prev, ...out].slice(0, MAX_DESIGN_PHOTOS));
  };
  const addOptionRow = (preset) => setNewOptions(prev => [...prev, { id: 'opt_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: preset ? preset.name : '', price: preset ? String(preset.price) : '', minutes: preset ? String(preset.minutes) : '' }]);
  const updateOptionRow = (id, patch) => setNewOptions(prev => prev.map(o => (o.id === id ? { ...o, ...patch } : o)));
  const removeOptionRow = (id) => setNewOptions(prev => prev.filter(o => o.id !== id));

  const startEditDesign = (d) => {
    setEditingId(d.id);
    setNewTitle(d.title);
    setNewPrice(String(d.price));
    setNewTags((d.tags || []).join(', '));
    setNewImgs(designImages(d));
    setNewOptions(optionsOf(d).map(o => ({ ...o, price: String(o.price), minutes: String(o.minutes) })));

  const cancelForm = () => {
    setShowAddForm(false);
    setEditingId(null);

    setNewTitle('');
    setNewPrice('');

    setNewOptions([]);

  const handleUploadArt = (e) => {

    const tagsArr = newTags ? newTags.split(',').map(t => t.trim()) : ['이달의아트'];
    const durationMin = Number(newDuration) > 0 ? Math.round(Number(newDuration)) : undefined;
    const includes = newIncludes.split(',').map(t => t.trim()).filter(Boolean);
    // 옵션: 이름 필수, 추가 금액·시간은 0 이상 숫자
    const badOpt = newOptions.find(o => !String(o.name).trim() || !(Number(o.price) >= 0) || !(Number(o.minutes) >= 0) || o.price === '' || o.minutes === '');

    const options = newOptions.map(o => ({ id: o.id, name: String(o.name).trim(), price: Math.round(Number(o.price)), minutes: Math.round(Number(o.minutes)) }));

    if (discount != null && !(discount >= 1 && discount <= 90)) { showToast('할인율은 1~90% 사이로 입력해주세요. (없으면 비워 두기)'); return; }

    if (editingId) {

    } else {
      const newArt = {
        id: 'd_' + Date.now(),
        title: newTitle,
        shopId: myShopId,
        shopName: myShop.name,

        cat: newCat,
        bizType: newBizType,

        rating: 0,
        reviews: 0,
        durationMin,
        includes,
        badge: 'NEW',
        tags: tagsArr,
        imgs: newImgs,
        img: newImgs[0] || undefined,

  };

  const q = searchQuery.trim();
  const shopById = (id) => shops.find(s => s.id === id);
  // ── 진행 중 광고 (모든 매장) ──
  // 기간: 등록 시각(startAt) + days일. startAt 없는 예전 광고는 진행 중으로 간주. 숨김·미승인 디자인 광고는 노출 안 함.
  // 노출 위치: 검색 상단 고정 → 키워드가 맞는 검색 결과 맨 위 / 홈 배너 노출 → 홈 추천 탭 이벤트 배너 아래 /
  //                        카테고리 상단 고정 → 해당 카테고리 둘러보기 맨 위. 모두 "광고" 표시.
  const adEndsAt = (a) => (a.startAt ? a.startAt + a.days * 86400000 : null);
  const adActive = (a) => a.status !== '종료' && !a.paused && (!a.startAt || Date.now() < adEndsAt(a));
  const adEnded = (a) => a.status === '종료' || (a.startAt && Date.now() >= adEndsAt(a));
  // 광고 성과 (노출·클릭·전환) — 노출은 이 브라우저에서 화면에 처음 보인 횟수(페이지를 열 때마다 1회) [검토 필요: 집계 기준]
  const [adStats, setAdStats] = usePersistentState('adStats', {});
  const adSeenRef = useRef(new Set());

  const bumpAd = (adId, key) => setAdStats(prev => ({ ...prev, [adId]: { imp: 0, click: 0, conv: 0, ...(prev[adId] || {}), [key]: ((prev[adId] || {})[key] || 0) + 1 } }));
  const seeAd = (adId) => { if (!adId || adSeenRef.current.has(adId) || isPreview) return; adSeenRef.current.add(adId); setTimeout(() => bumpAd(adId, 'imp'), 0); };
  const activeAds = Object.entries(shopOwnerData)
    .flatMap(([shopId, d]) => (d.ads || []).map(a => ({ ...a, shopId })))
    .filter(adActive)
    .map(ad => ({ ad, design: publicDesigns.find(d => d.id === ad.designId && d.shopId === ad.shopId) }))
    .filter(x => x.design);
  const searchInfo = searchTokens(q);
  const searchAds = q ? activeAds.filter(x => x.ad.type === '검색 상단 고정' && adKeywordMatches(x.ad.keyword, q)).slice(0, 2) : [];
  const searchAdIds = new Set(searchAds.map(x => x.design.id));
  const searchedDesigns = q ? publicDesigns
    .filter(d => !searchAdIds.has(d.id)) // 광고로 맨 위에 나온 디자인은 아래 목록에서 중복 제외
    .map(d => {
      const s = shopById(d.shopId);
      return { d, m: searchMatch([d.title, (d.tags || []).join(' '), d.shopName, d.location, s ? s.location : '', d.cat], q) };

    .filter(x => x.m.matched > 0)
    .sort((a, b) => bySearchRank(a, b) || ratingKey(b.d) - ratingKey(a.d))
    .map(x => x.d) : [];
  const searchedShops = q
    ? publicShops
      .map(s => ({ s, m: searchMatch([s.name, s.location, s.info], q) }))
      .filter(x => x.m.matched > 0)
      .sort(bySearchRank)
      .map(x => x.s)
    : visibleShops;
  // ── 검색 필터·정렬·지도 ──
  const [searchFilters, setSearchFilters] = useState(DEFAULT_SEARCH_FILTERS);

  const [showSearchFilters, setShowSearchFilters] = useState(false);
  const [mapShopId, setMapShopId] = useState(null);
  const filterActive = searchFilters.price !== 'all' || searchFilters.region !== 'all' || searchFilters.cat !== 'all' || searchFilters.discountOnly;
  const regionOf = (text) => { const t = String(text || ''); const r = SEARCH_REGIONS.find(x => x.match.some(m => t.includes(m))); return r ? r.key : null; };
  const designRegion = (d) => { const s = shopById(d.shopId); return regionOf(`${d.location} ${s ? s.location : ''}`); };
  const designPasses = (d) => {
    const f = searchFilters;
    if (f.price !== 'all') { const r = PRICE_RANGES.find(x => x.key === f.price); if (r && (d.price < r.min || d.price > r.max)) return false; }
    if (f.region !== 'all' && designRegion(d) !== f.region) return false;
    if (f.cat !== 'all' && d.cat !== f.cat) return false;
    if (f.discountOnly && !d.discount) return false;
    return true;
  };
  const designOrder = (d) => { const i = designs.findIndex(x => x.id === d.id); return i < 0 ? 9999 : i; }; // 최신순: 새로 등록한 디자인이 목록 앞쪽
  const sortDesigns = (list) => {
    const allMatch = new Set(q ? list.filter(d => { const s = shopById(d.shopId); return searchMatch([d.title, (d.tags || []).join(' '), d.shopName, d.location, s ? s.location : '', d.cat], q).all; }).map(d => d.id) : []);
    const arr = [...list];
    if (searchSort === 'newest') return arr.sort((a, b) => designOrder(a) - designOrder(b));
    if (searchSort === 'priceAsc') return arr.sort((a, b) => a.price - b.price);
    if (searchSort === 'priceDesc') return arr.sort((a, b) => b.price - a.price);
    if (searchSort === 'rating') return arr.sort((a, b) => ratingKey(b) - ratingKey(a) || designStats(b).count - designStats(a).count);
    // 인기순: 검색어가 있으면 모든 단어가 맞는 결과를 먼저, 그다음 후기 수(인기)
    return arr.sort((a, b) => (Number(allMatch.has(b.id)) - Number(allMatch.has(a.id))) || designStats(b).count - designStats(a).count);
  };
  const showSearchResults = !!q || filterActive;
  const resultDesigns = showSearchResults ? sortDesigns((q ? searchedDesigns : publicDesigns).filter(designPasses)) : [];
  const resultAds = searchAds.filter(x => designPasses(x.design));
  // 매장 결과: 지역 필터 + (가격·종류·할인 필터를 걸었으면) 조건에 맞는 디자인이 있는 매장만
  const designFilterActive = searchFilters.price !== 'all' || searchFilters.cat !== 'all' || searchFilters.discountOnly;

  const mapShops = showSearchResults
    ? publicShops.filter(s => resultShops.some(x => x.id === s.id) || resultDesigns.some(d => d.shopId === s.id) || resultAds.some(x => x.design.shopId === s.id))

  const searchCats = [...new Set(publicDesigns.map(d => d.cat))];
  const filterChips = [
    searchFilters.price !== 'all' && { key: 'price', label: (PRICE_RANGES.find(r => r.key === searchFilters.price) || {}).label },

  const popularTags = Object.entries(visibleDesigns.reduce((acc, d) => { (d.tags || []).forEach(t => { acc[t] = (acc[t] || 0) + d.reviews; }); return acc; }, {}))

  const saveRecentSearch = (term) => {
    const t = String(term || '').trim();
    if (!t) return;
    setRecentSearches(prev => [t, ...prev.filter(x => x !== t)].slice(0, MAX_RECENT_SEARCHES));
  };
  const runSearch = (term) => { setSearchQuery(term); saveRecentSearch(term); setB2cTab('search'); };

  const trending = [...visibleDesigns].sort((a, b) => b.reviews - a.reviews);
  const openDesign = (design) => {
    // 검색 결과에서 연 경우 검색어를 최근 검색어로 저장
    if (b2cTab === 'search' && searchQuery.trim()) saveRecentSearch(searchQuery);
    // 원장님이 본인 매장 상품을 보는 경우는 조회수에서 제외
    if (!(currentUser && currentUser.owner && currentUser.owner.shopId === design.shopId)) {
      setDesignViews(prev => ({ ...prev, [design.id]: (prev[design.id] || 0) + 1 }));
    }
    setSelectedDesign(design);
    resetBookingFlow();
  };

  const RecCard = ({ design, big, ad = false, adId }) => {
    const isLiked = likedIds.includes(design.id);
    if (adId) seeAd(adId);
    const openCard = () => { if (adId && !isPreview) { bumpAd(adId, 'click'); adClickRef.current[design.id] = adId; } openDesign(design); };
    return (
      <div
        role="button" tabIndex={0}
        aria-label={`${design.title}, ${design.shopName}, ${design.price.toLocaleString()}원`}
        onClick={() => openCard()}
        onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(); } }}
        className="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition-all cursor-pointer"
        style={big ? { width: '10rem', flexShrink: 0, boxSizing: 'border-box' } : { width: '100%', boxSizing: 'border-box' }}
      >
        <div style={{ position: 'relative', width: '100%', paddingTop: '100%', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0 }}>
            <Visual item={design} className="w-full h-full" size={big ? 160 : 200} />
          </div>
          {ad ? (
            <span className="absolute top-2 left-2 text-xs font-black text-slate-900 bg-amber-300 px-2 py-0.5 rounded" aria-label="광고">광고</span>
          ) : design.badge && (
            <span className="absolute top-2 left-2 text-xs font-bold text-white bg-slate-900 bg-opacity-80 px-2 py-0.5 rounded">{design.badge}</span>
          )}
          <button onClick={(e) => toggleLike(e, design.id)} onKeyDown={(e) => e.stopPropagation()} aria-label={isLiked ? `${design.title} 찜 해제` : `${design.title} 찜하기`} aria-pressed={isLiked} className="absolute top-2 right-2 p-1.5 rounded-full bg-white shadow active:scale-95 transition-all">
            <Heart className="w-4 h-4" style={isLiked ? { fill: '#f43f5e', stroke: '#f43f5e', color: '#f43f5e' } : { color: '#64748b' }} />
          </button>
        </div>
        <div className="p-2.5">
          <p className="text-xs font-bold text-slate-500 truncate">{design.shopName} · {design.location}</p>
          <h4 className="text-sm font-bold text-slate-800 line-clamp-1 mt-0.5">{design.title}</h4>
          <div className="flex items-center gap-1.5 mt-1.5">
            {design.discount && <span className="text-sm font-black" style={{ color: PINK }}>{design.discount}%</span>}
            <span className="text-sm font-black text-slate-900">{design.price.toLocaleString()}원</span>
          </div>
          <div className="flex items-center gap-0.5 mt-0.5">{designRating(design)}</div>
        </div>
      </div>
    );
  };

  // Pinterest-style minimal card for category browse pages
  const PinCard = ({ design, tall }) => {
    const isLiked = likedIds.includes(design.id);

      <div

        </div>
        {DEMO_MODE && <p className="text-xs font-bold text-slate-600 leading-relaxed">※ 시연용 프로토타입 — 매장·디자인·후기·예약은 모두 가상 데이터입니다.</p>}
        <p className="text-xs text-slate-500 leading-relaxed">{COMPANY_INFO}</p>

                ))}
              </fieldset>
              {/* 게시중단(임시조치) 요청 절차 — 정보통신망법 제44조의2 대응 방식 확정 후 안내 문구 보완 */}
              <p className="text-xs text-slate-500 leading-relaxed">신고된 후기는 운영팀이 확인 후 숨김 또는 유지로 처리해요. 허위 신고가 반복되면 이용이 제한될 수 있어요.</p>
              <button onClick={submitReport} className="w-full text-white text-sm font-bold py-3 rounded-xl" style={{ background: '#0f172a' }}>신고하기</button>
            </div>
          </Sheet>
        )}
        {toast && (
          <div role="status" aria-live="polite" className="absolute left-4 right-4 bottom-20 z-[60] bg-slate-900 text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-lg text-center whitespace-pre-line">
            {toast}
          </div>
        )}
        {confirmDlg && (
          <div className="absolute inset-0 z-[70] flex items-center justify-center p-6" style={{ backgroundColor: 'rgba(0,0,0,0.55)' }} onClick={() => closeConfirm(false)}>
            <div role="alertdialog" aria-modal="true" aria-labelledby="nm-confirm-title" aria-describedby="nm-confirm-msg" className="bg-white w-full rounded-2xl p-5 shadow-2xl space-y-3" onClick={(e) => e.stopPropagation()}>
              <h3 id="nm-confirm-title" className="text-base font-black text-slate-900">{confirmDlg.title || '확인해 주세요'}</h3>
              {confirmDlg.message && <p id="nm-confirm-msg" className="text-sm text-slate-600 leading-relaxed whitespace-pre-line">{confirmDlg.message}</p>}
              {confirmDlg.details && confirmDlg.details.length > 0 && (
                <dl className="bg-slate-50 rounded-xl p-3 text-sm space-y-1">
                  {confirmDlg.details.map(([k, v]) => (
                    <div key={k} className="flex justify-between gap-3"><dt className="text-slate-600">{k}</dt><dd className="font-bold text-slate-900 text-right">{v}</dd></div>
                  ))}
                </dl>
              )}
              {confirmDlg.input && (
                <label className="block">
                  <span className="block text-xs font-bold text-slate-600 mb-1">{confirmDlg.input.label}</span>
                  <textarea data-testid="confirm-input" value={confirmInput} onChange={(e) => setConfirmInput(e.target.value)} rows={2} maxLength={300} placeholder={confirmDlg.input.placeholder} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none resize-none" />
                </label>
              )}
              <div className="flex gap-2 pt-1">
                {!confirmDlg.infoOnly && (
                  <button data-testid="confirm-cancel" onClick={() => closeConfirm(false)} className="flex-1 py-2.5 rounded-xl border border-slate-200 text-sm font-bold text-slate-700">{confirmDlg.cancelText || '취소'}</button>
                )}
                <button data-testid="confirm-ok" autoFocus={!confirmDlg.input} disabled={!!confirmDlg.input && !confirmInput.trim()} onClick={() => closeConfirm(true)} className="flex-1 py-2.5 rounded-xl text-sm font-black text-white disabled:opacity-40" style={{ background: confirmDlg.danger ? '#be123c' : '#0f172a' }}>{confirmDlg.confirmText || '확인'}</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
</script>

<script>
  (function () {
    try {
      var source = document.getElementById('app-source').textContent;
      var output = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]]
      }).code;
      output += '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));';
      var script = document.createElement('script');
      script.textContent = output;
      document.body.appendChild(script);
    } catch (e) {
      document.getElementById('root').innerHTML = '<p style="padding:24px;font-size:14px">앱을 불러오지 못했어요. 새로고침해 주세요.</p>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
