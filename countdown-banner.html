<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>타임세일 카운트다운 배너</title>
<style>
  body {
    margin: 0;
    background: #0e0e0e;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .banner {
    background: #0a0a0a;
    border-radius: 20px;
    padding: 28px 36px;
    text-align: center;
    width: 340px;
    box-shadow: 0 0 40px rgba(255,255,255,0.05);
  }
  .label {
    color: #ff5f6d;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 6px;
  }
  .sub {
    color: #888;
    font-size: 12px;
    margin-bottom: 18px;
  }
  .clock {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 2px;
  }
  .digit {
    font-size: 56px;
    font-weight: 900;
    color: transparent;
    -webkit-text-stroke: 2px #ffffff;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(255,255,255,0.25);
  }
  .colon {
    font-size: 44px;
    font-weight: 900;
    color: #ff5f6d;
    -webkit-text-stroke: 1.5px #ff5f6d;
    margin: 0 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0.2; }
  }
  .caption {
    margin-top: 16px;
    color: #666;
    font-size: 11px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="label">🔥 타임세일</div>
    <div class="sub">오늘 자정까지 최대 30% 할인</div>
    <div class="clock">
      <span class="digit" id="h">00</span>
      <span class="colon">:</span>
      <span class="digit" id="m">00</span>
      <span class="colon">:</span>
      <span class="digit" id="s">00</span>
    </div>
    <div class="caption">HOURS&nbsp;&nbsp;&nbsp;&nbsp;MINUTES&nbsp;&nbsp;&nbsp;&nbsp;SECONDS</div>
  </div>

<script>
  function pad(n) { return String(n).padStart(2, '0'); }
  function update() {
    const now = new Date();
    const midnight = new Date(now);
    midnight.setHours(24, 0, 0, 0);
    let diff = Math.max(0, midnight - now);
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('h').textContent = pad(h);
    document.getElementById('m').textContent = pad(m);
    document.getElementById('s').textContent = pad(s);
  }
  update();
  setInterval(update, 1000);
</script>
</body>
</html>
